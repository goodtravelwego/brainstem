<meta name="theme-color" content="#101A18" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<style>

/* Layout: consumer phone app (missions, score, stickers); the simulated hardware rail is hidden (bs.css). Technical detail lives in the gear menu "ระบบหลังบ้าน". */
:root{
  --bg:#E9EFEC; --surface:#FFFFFF; --surface-2:#EEF3F1; --ink:#13302A; --muted:#5F756F; --line:#D8E2DE;
  --signal:#1B7666; --on-signal:#FFFFFF; --bird:#E09A12; --bird-ink:#7A5200; --std:#879A95;
  --danger:#B13E2C; --ok:#2C7A4C; --warn:#9A6200; --bezel:#121816; --app-bg:#F6F8F7;
  --th:#3E9A5B;
  --f-display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1110; --surface:#16221F; --surface-2:#1C2B27; --ink:#E1ECE8; --muted:#93A9A2; --line:#2A3B37;
  --signal:#4DBFA6; --on-signal:#062019; --bird:#F2B63A; --bird-ink:#F8D78E; --std:#7C908A;
  --danger:#E8735E; --ok:#62C189; --warn:#E3A63D; --bezel:#2A3431; --app-bg:#101A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1110; --surface:#16221F; --surface-2:#1C2B27; --ink:#E1ECE8; --muted:#93A9A2; --line:#2A3B37;
  --signal:#4DBFA6; --on-signal:#062019; --bird:#F2B63A; --bird-ink:#F8D78E; --std:#7C908A;
  --danger:#E8735E; --ok:#62C189; --warn:#E3A63D; --bezel:#2A3431; --app-bg:#101A18; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.stage{display:flex;gap:36px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.phone{width:396px;flex:none;background:var(--bezel);border-radius:54px;padding:12px;position:relative;box-shadow:0 24px 60px -24px rgba(10,30,25,.45)}
.island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#000;border-radius:20px;z-index:3}
.screen{background:var(--app-bg);border-radius:43px;height:800px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px 34px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.status .ic{display:flex;gap:6px;align-items:center}
.batt{width:24px;height:11px;border:1.5px solid var(--ink);border-radius:3px;position:relative;opacity:.85}
.batt::after{content:"";position:absolute;inset:1.5px;right:5px;background:var(--ink);border-radius:1px}
.appbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 18px 10px;min-height:52px}
.appbar h1{font-family:var(--f-display);font-weight:500;font-size:19px;margin:0;flex:1}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;flex:none}
.iconbtn svg{width:19px;height:19px}
.views{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 16px 24px;scrollbar-width:thin}
.view{display:flex;flex-direction:column;gap:12px}
h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance}
h2{font-size:17px} h3{font-size:14.5px}
.card{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{font:inherit;font-family:var(--f-display);font-weight:500;font-size:16px;border-radius:18px;padding:14px 16px;cursor:pointer;border:0;background:var(--surface);color:var(--ink);width:100%}
.btn.pri{background:var(--th);color:#fff}
.btn.sm{font-family:var(--f-body);font-size:13px;padding:8px 12px;border-radius:12px;width:auto;background:var(--surface-2)}
.btn.link{background:transparent;font-family:var(--f-body);font-size:13px;color:var(--muted);padding:6px;text-decoration:underline;text-underline-offset:3px}
.btn:focus-visible,.seg button:focus-visible,.iconbtn:focus-visible,.hwbtn:focus-visible,.tg:focus-visible{outline:2px solid var(--bird);outline-offset:2px}
.seg{display:flex;background:var(--surface-2);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;font:inherit;font-size:13.5px;padding:8px 6px;border:0;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--signal);color:var(--on-signal);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
.err{font-size:12.5px;color:var(--danger)}
/* consumer */
.hello{font-family:var(--f-display);font-size:24px;line-height:1.25}
/* profiles + care mode */
.who{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:14px;flex:none}
.plist{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.prow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:10px 12px;border:0;font:inherit;color:var(--ink);cursor:pointer;width:100%;text-align:left}
.prow.on{box-shadow:inset 0 0 0 2px var(--th)}
.prow .t{flex:1;min-width:0}.prow b{font-weight:500;display:block}
.pform{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:var(--surface);border-radius:16px;padding:12px}
.hw{width:270px;display:flex;flex-direction:column;gap:14px;padding-top:30px}
.hw h2{font-size:15px}
.hwcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.hwbtn{width:150px;height:150px;border-radius:50%;border:0;background:var(--bird);color:#3B2600;font-family:var(--f-display);font-size:22px;cursor:pointer;box-shadow:0 8px 0 var(--bird-ink),0 0 0 10px var(--surface-2);align-self:center;margin:8px 0 12px;transition:transform .06s,box-shadow .06s;touch-action:manipulation;user-select:none}
.hwbtn.down{transform:translateY(6px);box-shadow:0 2px 0 var(--bird-ink),0 0 0 10px var(--surface-2)}
.hwbtn:disabled{opacity:.45;cursor:default}
.spk{display:flex;align-items:center;gap:8px}
.spk i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.spk i.on{background:var(--signal)}
@media (prefers-reduced-motion:reduce){.hwbtn{transition:none}}
@media (max-width:560px){
  body{padding-block:8px 32px}
  .phone{width:100%;background:transparent;padding:0;border-radius:0;box-shadow:none}
  .island,.status{display:none}
  .screen{height:auto;border-radius:0;background:transparent;overflow:visible}
  .appbar{padding-inline:0}
  .views{overflow:visible;padding:2px 0 16px}
  .hw{width:100%;padding-top:0}
}
/* BrainSTEM — four pillars, each owns one hue: S coral, T violet, E blue, M teal */
:root{--S:#D9533F;--T:#6E4FC0;--E:#2F64AD;--M:#1F8277;--th:#2F64AD;--card-sh:0 1px 2px rgba(15,40,35,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--S:#F07A68;--T:#A08BEA;--E:#6FA0E8;--M:#4DBFA6;--th:#4F86D6;--card-sh:none}}
:root[data-theme="dark"]{--S:#F07A68;--T:#A08BEA;--E:#6FA0E8;--M:#4DBFA6;--th:#4F86D6;--card-sh:none}
.views{padding-bottom:28px}
.wm{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em}.wm b{font-weight:600}
.wm .s{color:var(--S)}.wm .t{color:var(--T)}.wm .e{color:var(--E)}.wm .m{color:var(--M)}
.btn.big{font-size:17px;padding:16px;border-radius:20px}
.btn.pri:disabled{opacity:.45}
.sech{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.lbl{letter-spacing:.01em}
.ico-s svg{width:16px;height:16px}

.hw{width:320px}
/* home */
.hi{display:flex;flex-direction:column;gap:0;padding:2px 2px 0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{--c:var(--E);position:relative;border:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer;border-radius:22px;padding:14px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,var(--surface)) 0%,var(--surface) 70%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,var(--line))}
.pc .L{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--c);font-weight:500}
.pc .w b{display:block;font-family:var(--f-display);font-weight:500;font-size:15.5px}
.pc .w span{font-size:11.5px;color:var(--muted)}
.pc .st{position:absolute;top:14px;right:14px;font-size:11px;color:var(--muted);font-family:var(--f-mono);text-align:right}
.pc .st i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:4px;vertical-align:1px}
.pc.S{--c:var(--S)}.pc.T{--c:var(--T)}.pc.E{--c:var(--E)}.pc.M{--c:var(--M)}
.nextc{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:12px 14px;box-shadow:var(--card-sh)}
.nextc .nb{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:19px;flex:none}
.nextc .nt{flex:1;min-width:0}.nextc .nt b{display:block;font-weight:500}.nextc .nt span{font-size:12px;color:var(--muted)}
.nextc button{flex:none}
.tl{display:flex;flex-direction:column;background:var(--surface);border-radius:20px;overflow:hidden}
.tli{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:transparent;font:inherit;color:var(--ink);text-align:left;width:100%;cursor:pointer}
.tli+.tli{border-top:1px solid var(--line)}
.tli .tb{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;color:#fff;flex:none}
.tli .tt{flex:1;min-width:0}.tli .tt b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tli .tt span{font-size:11.5px;color:var(--muted)}
.tli .tv{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);flex:none}
.tl .empty{padding:16px;text-align:center;color:var(--muted);font-size:12.5px}
.bS{background:var(--S)}.bT{background:var(--T)}.bE{background:var(--E)}.bM{background:var(--M)}

/* home v2: S and T lead */
.duec{display:flex;align-items:center;gap:12px;border:0;width:100%;font:inherit;color:var(--ink);text-align:left;cursor:pointer;border-radius:18px;padding:12px 14px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--warn) 45%,transparent)}
.duec .nb{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:18px;flex:none}
.duec .nt{flex:1}.duec .nt b{display:block;font-weight:500}.duec .nt span{font-size:12px;color:var(--muted)}.duec .go{font-size:20px;color:var(--muted)}
.bigc{--c:var(--S);position:relative;overflow:hidden;width:100%;border:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:178px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 24%,var(--surface)) 0%,var(--surface) 78%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 26%,var(--line))}
.bigc.T{--c:var(--T);cursor:default}
.bigc .BL{position:absolute;right:-6px;top:-30px;font-family:var(--f-display);font-size:150px;line-height:1;color:var(--c);opacity:.13;pointer-events:none;font-weight:500}
.bigc .bt{display:flex;flex-direction:column;gap:2px;border:0;background:transparent;font:inherit;color:inherit;text-align:left;padding:0;cursor:pointer;position:relative}
.bigc .bt b{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.2}
.bigc .bg{display:flex;flex-direction:column;gap:6px;margin-top:auto;font-size:12.5px;color:var(--muted);position:relative}
.bigc .cta{border:0;background:var(--c);color:#fff;font:inherit;font-family:var(--f-display);font-weight:500;font-size:14px;padding:7px 16px;border-radius:999px;cursor:pointer}
.gbar{display:block;height:6px;border-radius:3px;background:color-mix(in srgb,var(--c) 14%,var(--surface-2));overflow:hidden}.gbar u{display:block;height:100%;text-decoration:none;border-radius:3px}
.tq{display:flex;gap:6px;position:relative}.tq button{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;padding:7px 11px;border-radius:12px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.tq button svg{color:var(--T)}
.secrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.smc{display:flex;align-items:center;gap:10px;border:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;background:var(--surface);border-radius:18px;padding:11px 12px}
.smc .L{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:17px;flex:none}
.smc.E .L{background:var(--E)}.smc.M .L{background:var(--M)}
.smc b{display:block;font-weight:500;font-size:13.5px}.smc .lbl{font-size:11.5px}
.dueb{font-style:normal;color:#fff;background:var(--warn);border-radius:6px;padding:0 6px;font-size:11px}
/* settings */
.sgrp{background:var(--surface);border-radius:20px;padding:4px 14px;display:flex;flex-direction:column}
.sgrp h3{font-size:12px;color:var(--muted);font-family:var(--f-body);font-weight:500;letter-spacing:.04em;text-transform:uppercase;padding:10px 0 2px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;font-size:14px;border:0;background:transparent;color:var(--ink);font:inherit;width:100%;text-align:left}
.srow+.srow{border-top:1px solid var(--line)}
.srow.col{flex-direction:column;align-items:stretch}.srow>span:first-child{display:inline-flex;align-items:center;gap:8px}
.srow.lnk{cursor:pointer}.srow.lnk>span:last-child{color:var(--muted);font-size:18px}
.pl{width:22px;height:22px;border-radius:7px;display:inline-grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:500;font-size:12px}.pl.S{background:var(--S)}.pl.T{background:var(--T)}
/* train */
.phero{display:flex;align-items:center;gap:14px;padding:6px 2px}
.phero>b{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:28px;font-weight:500}
.phero.t>b{background:var(--T)}
.mod{display:flex;align-items:center;gap:14px;border:0;background:var(--surface);border-radius:22px;padding:16px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;box-shadow:var(--card-sh)}
.mod .mi{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--T) 15%,var(--surface));color:var(--T);flex:none}
.mod .mt{flex:1;min-width:0}.mod .mt b{display:block;font-family:var(--f-display);font-weight:500;font-size:16px}.mod .mt span{font-size:12px;color:var(--muted)}
.mod .go{font-size:24px;color:var(--muted)}
.tip{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:16px;padding:10px 12px}
.tip:empty{display:none}

/* tabbar */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px 10px 18px;background:var(--app-bg);border-top:1px solid var(--line)}
.tabbar button{border:0;background:transparent;font:inherit;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 2px;cursor:pointer;border-radius:12px}
.tabbar button b{font-family:var(--f-display);font-size:19px;line-height:24px;font-weight:500;width:28px;text-align:center}
.tabbar button svg{width:22px;height:22px;margin:1px 0}
.tabbar em{font-style:normal;font-size:10.5px}
.tabbar button.on{color:var(--ink)}.tabbar button.on em{font-weight:600}
.tabbar .tS b{color:var(--S)}.tabbar .tT b{color:var(--T)}.tabbar .tE b{color:var(--E)}.tabbar .tM b{color:var(--M)}
.tabbar button.on b{color:#fff;border-radius:9px}
.tabbar .tS.on b{background:var(--S)}.tabbar .tT.on b{background:var(--T)}.tabbar .tE.on b{background:var(--E)}.tabbar .tM.on b{background:var(--M)}
.tabbar button:focus-visible{outline:2px solid var(--E)}

/* sheet */
.sheet{position:absolute;inset:0;background:rgba(5,15,13,.45);z-index:20;display:flex;align-items:flex-end}
.sh-in{background:var(--app-bg);width:100%;border-radius:26px 26px 0 0;padding:18px 16px 26px;max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sh-h{display:flex;align-items:center;justify-content:space-between}
.inp{font:inherit;font-size:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.frow{display:grid;grid-template-columns:1fr 90px;gap:8px}

/* module overlay */
.modov{position:fixed;inset:0;z-index:100;background:var(--bg)}
.modov iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}

/* ---------- Evaluate builder ---------- */
.lastc{border:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;display:flex;align-items:center;gap:14px;border-radius:24px;padding:16px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--E) 18%,var(--surface)),var(--surface) 75%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--E) 25%,var(--line))}
.lastc .lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lastc .lt b{font-family:var(--f-display);font-weight:500;font-size:16px}
.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{display:block}.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .rv b{font-family:var(--f-display);font-weight:500}
.ring .rv span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.conf{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;width:max-content}
.conf i{display:inline-flex;gap:2px}.conf i u{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.25;text-decoration:none}.conf i u.on{opacity:1}
.conf.hi{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}.conf.md{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}.conf.lo{color:var(--danger);background:color-mix(in srgb,var(--danger) 13%,transparent)}
.presets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.presets::-webkit-scrollbar{display:none}
.presets button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;padding:7px 12px;border-radius:999px;cursor:pointer;display:flex;gap:6px;align-items:center}
.presets button em{font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.presets button.on{background:var(--E);border-color:var(--E);color:#fff}.presets button.on em{color:rgba(255,255,255,.75)}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tk{position:relative;border:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;background:var(--surface);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:104px;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .15s,background .15s}
.tk .ti{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.tk b{font-weight:500;font-size:13.5px;line-height:1.25}
.tk .td{font-size:11px;color:var(--muted);font-family:var(--f-mono);margin-top:auto}
.tk .ck{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;color:#fff}
.tk.on{box-shadow:inset 0 0 0 2px var(--E);background:color-mix(in srgb,var(--E) 7%,var(--surface))}
.tk.on .ti{background:var(--E);color:#fff}.tk.on .ck{background:var(--E);box-shadow:none}
.tk .ck svg{width:12px;height:12px}
.tk.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}
.tk.wide .td{margin:0 30px 0 auto}
.seqs{display:flex;gap:3px;height:30px;border-radius:12px;overflow:hidden}
.seqs i{display:grid;place-items:center;color:#fff;background:var(--E);min-width:24px}
.seqs i svg{width:15px;height:15px}
.seqs i.ck{background:color-mix(in srgb,var(--E) 45%,var(--surface-2))}
.seqs:empty{display:none}
.adv{background:var(--surface);border-radius:18px;padding:0 14px}
.adv summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.adv summary::-webkit-details-marker{display:none}
.adv[open] summary{border-bottom:1px solid var(--line)}
.orow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;font-size:13.5px}
.orow+.orow{border-top:1px solid var(--line)}
.orow .seg{min-width:150px}
.stp{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:3px}
.stp button{width:30px;height:30px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-size:17px;cursor:pointer}
.stp b{font-family:var(--f-display);font-weight:500;font-size:16px;min-width:30px;text-align:center}.stp span{font-size:11px;color:var(--muted);margin-right:6px}
.tg{width:46px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tg[aria-pressed=true]{background:var(--E)}.tg[aria-pressed=true]::after{left:21px}

/* ---------- Run ---------- */
.run{gap:10px;height:100%}
.rtop{display:flex;align-items:center;gap:10px}
.rsteps{flex:1;display:flex;gap:4px}
.rsteps i{flex:1;height:30px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);position:relative;overflow:hidden}
.rsteps i svg{width:15px;height:15px;position:relative}
.rsteps i.done{background:color-mix(in srgb,var(--E) 30%,var(--surface-2));color:var(--E)}
.rsteps i.cur{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--E);color:var(--E)}
.rsteps i.cur u{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--E) 18%,transparent);text-decoration:none}
.qchip{font-size:11px;font-family:var(--f-mono);letter-spacing:2px;padding:4px 8px;border-radius:10px;background:var(--surface)}
.qchip u{text-decoration:none}.qchip .g{color:var(--ok)}.qchip .y{color:var(--warn)}.qchip .r{color:var(--danger)}
.rstage{flex:1;min-height:400px;background:var(--surface);border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;text-align:center;position:relative;overflow:hidden}
.rstage.dark{background:#070C0B;color:#C9D6D2}
.rstage h2{font-size:22px}
.rstage .big-ic{width:96px;height:96px;border-radius:32px;display:grid;place-items:center;background:color-mix(in srgb,var(--E) 14%,var(--surface));color:var(--E)}
.rstage .big-ic svg{width:52px;height:52px}
.pics{display:flex;gap:14px;justify-content:center}
.pics span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);width:72px}
.pics span i{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.pics span i svg{width:24px;height:24px}
.pics span.x i{position:relative}.pics span.x i::after{content:"";position:absolute;width:52px;height:2px;background:var(--danger);transform:rotate(-45deg)}
.cd{font-family:var(--f-display);font-size:88px;line-height:1;color:var(--E)}
.fix{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--ink);font-weight:300}
.rclock{position:absolute;bottom:14px;right:16px;font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.rclock svg{transform:rotate(-90deg)}
.tap{width:170px;height:170px;border-radius:50%;border:0;background:color-mix(in srgb,var(--E) 14%,var(--surface));color:var(--E);font-family:var(--f-display);font-size:20px;cursor:pointer;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--E) 40%,transparent);touch-action:manipulation;user-select:none;transition:transform .06s}
.tap.down{transform:scale(.94);background:color-mix(in srgb,var(--E) 30%,var(--surface))}
.tones{display:flex;gap:18px;align-items:flex-end;justify-content:center}
.tones span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.tones span i{width:52px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--ink)}
.tones span.tg2 i{background:var(--E);color:#fff}
.bigstp{display:flex;align-items:center;gap:16px}
.bigstp button{width:54px;height:54px;border-radius:50%;border:0;background:var(--surface-2);color:var(--ink);font-size:26px;cursor:pointer}
.bigstp b{font-family:var(--f-display);font-size:54px;font-weight:500;min-width:110px;text-align:center}
.reeg{width:100%;height:auto;max-width:100%;background:var(--surface);border-radius:18px;display:block}
.rctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.chk4 span{background:var(--surface-2);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.chk4 span b{font-family:var(--f-display);font-weight:500;font-size:15px}
.chk4 span i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chk4 span.g{box-shadow:inset 0 0 0 1.5px var(--ok)}.chk4 span.g b{color:var(--ok)}
.chk4 span.y{box-shadow:inset 0 0 0 1.5px var(--warn)}.chk4 span.y b{color:var(--warn)}
.chk4 span.r{box-shadow:inset 0 0 0 1.5px var(--danger)}.chk4 span.r b{color:var(--danger)}
.mline{display:flex;align-items:center;gap:8px;width:100%;font-size:12px;color:var(--muted)}
.mline .bar{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}.mline .bar u{display:block;height:100%;background:var(--ok);text-decoration:none;transition:width .3s}
.spin{width:64px;height:64px;border-radius:50%;border:4px solid var(--surface-2);border-top-color:var(--E);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.astep{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);text-align:left}
.astep span.ok{color:var(--ink)}.astep span.ok::before{content:"✓ ";color:var(--ok)}

/* P300 training */
.trhero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:linear-gradient(150deg,color-mix(in srgb,var(--T) 18%,var(--surface)),var(--surface) 75%);border-radius:22px;padding:14px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--T) 22%,var(--line))}
.trhero div{display:flex;flex-direction:column}.trhero b{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.15}.trhero small{font-size:12px;color:var(--muted);font-family:var(--f-body)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tgc{position:relative;border:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;background:var(--surface);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 0 1.5px var(--line)}
.tgc.isrec{box-shadow:inset 0 0 0 2px var(--T)}
.tgc .ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--T) 14%,var(--surface));color:var(--T);margin-bottom:6px}
.tgc b{font-family:var(--f-display);font-weight:500;font-size:16px}.tgc .th{font-size:11.5px;color:var(--muted)}
.tgc .lv{display:flex;gap:3px;margin-top:6px}.tgc .lv i{width:14px;height:5px;border-radius:3px;background:var(--surface-2)}.tgc .lv i.on{background:var(--T)}
.tgc .tbest{font-size:11px;color:var(--muted);position:absolute;right:14px;top:16px}
.tgc .rtag{position:absolute;right:10px;top:-8px;background:var(--T);color:#fff;font-size:10.5px;padding:2px 8px;border-radius:999px}
.tgc.isrec .tbest{top:22px}
.tpri{background:var(--T)!important}
.gstage{min-height:520px}
.gtop{display:flex;align-items:center;gap:10px}.gtop .mono{font-size:15px;min-width:28px;color:var(--T);font-weight:500}
.gprog{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}.gprog u{display:block;height:100%;width:0;background:var(--T);text-decoration:none}
.gorb{--fc:var(--T);width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--T) 16%,var(--surface)),var(--surface) 70%);position:relative}
.gorb>*{grid-area:1/1}
.gorb.pop{animation:pop .45s ease-out}
@keyframes pop{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--fc) 55%,transparent)}100%{box-shadow:0 0 0 26px transparent}}
.gring{width:130px;height:130px;border-radius:50%;border:3px solid var(--T);display:block;transition:opacity .2s}
.gfb{font-family:var(--f-display);font-size:18px;min-height:28px}
.ttap{background:color-mix(in srgb,var(--T) 14%,var(--surface));color:var(--T);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--T) 40%,transparent)}
.ttap.down{background:color-mix(in srgb,var(--T) 30%,var(--surface))}
.track{position:relative;height:34px;border-radius:17px;background:var(--surface);border:1px dashed var(--line)}
.track .car{position:absolute;top:6px;left:0;transition:left .4s ease}
.track .flag{position:absolute;right:10px;top:9px;width:4px;height:16px;background:var(--ink);border-radius:2px}
.track .flag::after{content:"";position:absolute;left:4px;top:0;width:10px;height:8px;background:var(--S)}
.lvchg{font-family:var(--f-display);font-size:18px}
@media (prefers-reduced-motion:reduce){.gorb.pop{animation:none}.track .car{transition:none}}
/* mental math */
.mq{font-family:var(--f-mono);font-size:64px;line-height:1;color:var(--ink);min-height:72px;display:grid;place-items:center}
.mq.q{font-size:40px;font-family:var(--f-display);font-weight:500;letter-spacing:.02em}
.mlv{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);border-radius:999px;padding:3px 10px}
.mlv.h{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.mdemo{display:flex;gap:10px;justify-content:center}
.mdemo span{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-2);border-radius:14px;padding:10px 14px}
.mdemo b{font-family:var(--f-display);font-weight:500;font-size:20px}.mdemo em{font-style:normal;font-size:12px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.mdemo .ok{box-shadow:inset 0 0 0 1.5px var(--ok)}.mdemo .ok em{color:var(--ok)}
/* live event legend */
.eleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);margin-top:-4px;padding:0 4px}
.eleg span{display:inline-flex;align-items:center;gap:5px}.eleg i{width:3px;height:12px;border-radius:2px;display:inline-block}
.eleg .cnt{margin-left:auto;gap:6px;font-size:12px}.eleg i.d{background:repeating-linear-gradient(var(--muted) 0 2px,transparent 2px 4px)}
/* visual oddball */
.vbox{width:150px;height:150px;display:grid;place-items:center}
.vs{display:grid;place-items:center;width:84px;height:84px;font-style:normal}
.vs.std{border-radius:50%;background:var(--E)}
.vs.tgt{color:var(--S)}.vs.tgt svg{fill:var(--S)}
.vstim-demo{display:flex;gap:28px;justify-content:center}
.vstim-demo span{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.vstim-demo .vs{width:52px;height:52px}
/* ---------- Report ---------- */
.rhero{border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--E) 20%,var(--surface)),var(--surface) 70%)}
.rhero .top{display:flex;align-items:center;gap:16px}
.rhero .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rhero .meta b{font-family:var(--f-display);font-weight:500;font-size:18px}
.tdone{display:flex;gap:5px;flex-wrap:wrap}
.tdone i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface);color:var(--E)}
.tdone i svg{width:15px;height:15px}
.rtabs{position:sticky;top:-2px;z-index:4;background:var(--app-bg);padding:4px 0}
.dom{display:flex;flex-direction:column;background:var(--surface);border-radius:22px;overflow:hidden}
.dr{display:grid;grid-template-columns:30px 1fr 44px;grid-template-rows:auto auto;column-gap:10px;row-gap:6px;align-items:center;padding:12px 14px;border:0;background:transparent;font:inherit;color:var(--ink);text-align:left;width:100%;cursor:pointer}
.dr+.dr,.dx+.dr{border-top:1px solid var(--line)}
.dr .di{grid-row:1/3;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.dr .di svg{width:17px;height:17px}
.dr .dn{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px;min-width:0}
.dr .dn .conf{font-size:10px;padding:1px 6px}
.dr .dv{font-family:var(--f-display);font-size:18px;text-align:right;font-weight:500}
.dr .pb{grid-column:2/4}
.pbar{position:relative;height:14px}
.pbar .tr{position:absolute;left:0;right:0;top:5px;height:4px;border-radius:2px;background:var(--surface-2)}
.pbar .nb{position:absolute;top:3px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--ok) 22%,transparent)}
.pbar .ci{position:absolute;top:6px;height:2px;background:var(--ink);opacity:.35}
.pbar .mk{position:absolute;top:1px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.dx{padding:0 14px 12px 54px;display:flex;flex-direction:column;gap:2px}
.mrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:12.5px;padding:5px 0}
.mrow+.mrow{border-top:1px dashed var(--line)}
.mrow span{color:var(--muted)}.mrow b{font-family:var(--f-mono);font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums}
.zt{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:6px;min-width:46px;text-align:center}
.zt.n{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.zt.w{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}.zt.b{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.kf{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:12px;padding:7px 10px;font-size:12.5px}
.kf b{font-family:var(--f-mono);font-weight:500}
.kf i{width:8px;height:8px;border-radius:50%}
.chart{background:var(--surface);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chart .ch svg{flex:none;width:18px;height:18px;color:var(--muted)}
.chart .ch b{font-family:var(--f-display);font-weight:500;font-size:14.5px}
.leg{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.ax{font-family:var(--f-mono);font-size:9.5px;fill:var(--muted)}
.qt{display:flex;flex-direction:column;background:var(--surface);border-radius:22px;overflow:hidden}
.qr{display:grid;grid-template-columns:30px 1fr repeat(3,auto);gap:10px;align-items:center;padding:11px 14px;font-size:12.5px}
.qr+.qr{border-top:1px solid var(--line)}
.qr .di{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--E)}.qr .di svg{width:16px;height:16px}
.qr b{font-weight:500}.qr .qv{font-family:var(--f-mono);font-size:11.5px;text-align:right;min-width:44px}
.qr .qv small{display:block;color:var(--muted);font-family:var(--f-body);font-size:10px}
.qok{color:var(--ok)}.qmd{color:var(--warn)}.qlo{color:var(--danger)}
.rec{display:flex;align-items:center;gap:12px;border:0;background:var(--surface);border-radius:20px;padding:12px 14px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;width:100%}
.rec .nb{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:18px;flex:none}
.rec .nt{flex:1;min-width:0}.rec .nt b{display:block;font-weight:500;font-size:13.5px}.rec .nt span{font-size:11.5px;color:var(--muted)}
.rec .go{color:var(--muted);font-size:20px}
.cmp{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;font-size:12.5px;padding:9px 14px}
.cmp+.cmp{border-top:1px solid var(--line)}
.cmp b{font-family:var(--f-mono);font-weight:500;font-size:12px;text-align:right}.cmp span{color:var(--muted)}
.rci{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:500;min-width:58px;text-align:center}
.rci.up{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.rci.dn{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}.rci.eq{background:var(--surface-2);color:var(--muted)}
.fine{font-size:11px;color:var(--muted);line-height:1.5}
.topo{display:flex;gap:10px;justify-content:space-around}
.topo figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}

/* markers */
.mk-g{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.mk-g .di{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--E)}
.mk{background:var(--surface);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.mk-h{display:flex;align-items:center;justify-content:space-between;gap:8px}.mk-h b{font-weight:500;font-size:14px}
.mk-v{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.mk-v b{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}.mk-v span{font-size:12px;color:var(--muted)}.mk-v em{font-style:normal;font-size:11px;color:var(--muted);font-family:var(--f-mono);margin-left:auto}

:24);e.dataset.done=1}})}\nconst $=id=>document.getElementById(id);\nconst clamp=(x,a,b)=>Math.max(a,Math.min(b,x));\nconst fmtT=s=>{s=Math.max(0,Math.ceil(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};\nconst ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};\nObject.assign(IC,{brain:'<path d=\"M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a2 2 0 0 0-3-1z\"/><path d=\"M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1\"/>',sprout:'<path d=\"M12 20v-8\"/><path d=\"M12 12C12 8 9 6 5 6c0 4 3 6 7 6z\"/><path d=\"M12 10c0-3 2.5-5 6-5 0 3.5-2.5 5-6 5z\"/>',balance:'<path d=\"M12 4v16M7 20h10M5 8h14\"/><path d=\"M5 8l-2.5 6h5zM19 8l-2.5 6h5z\"/>',wave:'<path d=\"M2 12c2-4 3.5-4 5 0s3 4 5 0 3-4 5 0 3 4 5 0\"/>',bolt:'<path d=\"M13 2L4 14h7l-1 8 9-12h-7z\"/>',spark:'<path d=\"M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6\"/>',star:'<path d=\"M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z\"/>',sun:'<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/>',\n copy:'<rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2\"/><path d=\"M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2\"/>',edit:'<path d=\"M4 20h4L19 9l-4-4L4 16z\"/>',trash:'<path d=\"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13\"/>',\n up:'<path d=\"M6 15l6-6 6 6\"/>',dn:'<path d=\"M6 9l6 6 6-6\"/>',thermo:'<path d=\"M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z\"/>',shield:'<path d=\"M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z\"/><path d=\"M8.5 12l2.5 2.5 4.5-5\"/>'});\n\n/* ---------- 19 emission points (10-20 system) ---------- */\nconst PTS=['Fp1','Fp2','F7','F3','Fz','F4','F8','T3','C3','Cz','C4','T4','T5','P3','Pz','P4','T6','O1','O2'];\nconst XY={Fp1:[90,32],Fp2:[130,32],F7:[52,60],F3: tion: case series report. Photomed Laser Surg 35:432–441.',\n chao:'Chao LL (2019) Effects of home photobiomodulation treatments on cognitive and behavioral function, cerebral perfusion, and resting-state functional connectivity in patients with dementia: a pilot trial. Photobiomodul Photomed Laser Surg 37:133–141.',\n vargas:'Vargas E, et al. (2017) Beneficial neurocognitive effects of transcranial laser in older adults. Lasers Med Sci 32:1153–1162.',\n barrett:'Barrett DW, Gonzalez-Lima F (2013) Transcranial infrared laser stimulation produces beneficial cognitive and emotional effects in humans. Neuroscience 230:13–23.',\n schiffer:'Schiffer F, et al. (2009) Psychological benefits 2 and 4 weeks after a single treatment with near infrared light to the forehead: a pilot study of 10 patients with major depression and anxiety. Behav Brain Funct 5:46.',\n cassano:'Cassano P, et al. (2018) Transcranial photobiomodulation for the treatment of major depressive disorder: the ELATED-2 pilot trial. Photomed Laser Surg 36:634–646.',\n iaccarino:'Iaccarino HF, et al. (2016) Gamma frequency entrainment attenuates amyloid load and modifies microglia. Nature 540:230–235.',\n klimesch:'Klimesch W (1999) EEG alpha and theta oscillations reflect cognitive and memory performance. Brain Res Rev 29:169–195.',\n sterman:'Sterman MB (1996) Physiological origins and functional correlates of EEG rhythmic activities: implications for self-regulation. Biofeedback Self Regul 21:3–33.',\n kids:'Transcranial photobiomodulation in children aged 2–6 years: a randomized sham-controlled clinical trial (safety, ASD symptoms, EEG). Front Neurol (2024) 15:1221193.',\n isw:'iMediSync. iSyncWave PBM Protocol Guide (แนวทางผู้ผลิต).',\n vl:'Gracefire P. Guide to Neuromodulation: Vielight NeuroPro 2 (แนวทางผู้ผลิต).'};\nconst EVL={pilot:['งานวิจัยนำร่อง','มีงานวิจัยขนาดเล็กหรือ pilot ที่ใช้ความถี่หรือตำแหน่งคล้ายกัน แต่ยังไม่มีการทดลองขนาดใหญ่'],guide:['แนวทางผู้ผลิต','ความถี่และลำดับขั้นมาจากแนวทางของผู้ EEG และมีการทดลองนำร่องใช้ที่บ้านในผู้มีภาวะสมองเสื่อม',f:'40 Hz · γ',ev:'pilot',r:['zomorrodi','chao','iaccarino','isw']},\n 'vl-emo':{why:'ไล่ความถี่จากทีต้าขึ้นไปทีละขั้นที่จุดบริเวณลิมบิก (หน้าผากล่างและท้ายทอย) ตามแนวทางของ Gracefire เพื่อปรับสมดุลอารมณ์ แสงกะพริบเปลี่ยนคลื่นสมองได้จริงและขึ้นกับขนาดแสง แต่ลำดับขั้นนี้ยังไม่มีการทดลองโดยตรง',f:'4→ ไล่ขึ้น · θ',ev:'guide',r:['zomorrodi','spera','vl']},\n 'vl-relax':{why:'เริ่มด้วยการกวาดความถี่กว้าง (1–45 Hz) ที่ความแรงต่ำ แล้วค่อยเข้าย่านอัลฟา ซึ่งปรับตาม IAPF ของผู้ใช้จากผลประเมิน (E) เพื่อคลายเครียดและคลายกล้ามเนื้อ',f:'Sweep → α (IAPF)',ev:'guide',r:['zomorrodi','klimesch','vl']},\n 'vl-focus':{why:'กวาดความถี่ก่อน แล้วเข้าย่านเบต้ากลางทั้งศีรษะเพื่อความตื่นตัวและสมาธิต่อเนื่อง ลำดับขั้นมาจากแนวทางผู้ผลิต และมีงานวิจัยยืนยันว่าแสงกะพริบเปลี่ยนพลังงานคลื่นเบต้าได้',f:'Sweep → β',ev:'guide',r:['zomorrodi','spera','vl']},\n 'vl-flex':{why:'สลับอัลฟาที่จุดซ้าย-ขวาแบบไขว้ (chiastic เป็นการเลือกตำแหน่ง ไม่ใช่การสลับจังหวะ) กับแกมมาทั้งศีรษะ เพื่อการคิดสร้างสรรค์ ตามแนวทางผู้ผลิต',f:'α ↔ γ',ev:'guide',r:['zomorrodi','saltmarche','vl']},\n 'vl-enh':{why:'ผสมทีต้าเข้ากับแกมมาสูง (cross-frequency) ตามแนวทางผู้ผลิต เพื่อความไวในการคิดและการเคลื่อนไหว ถือเป็นขั้นทดลอง ยังไม่มีงานวิจัยในคนที่ใช้รูปแบบนี้โดยตรง',f:'θ + γ',ev:'guide',r:['zomorrodi','spera','vl']}};\nfunction aboutHTML(p){const I=PINFO[p.id];if(!I)return '';const E=EVL[I.ev],rs=[...I.r,'hashmi'];\n  return `<div class=\"pa-h\"><b>About<\/b><span class=\"evc ev-${I.ev}\">${E[0]}<\/span><\/div><p class=\"pa-w\">${I.why}<\/p>\n  <div class=\"pa-r\"><span>${icon('pulse',16)}<em>ความถี่<\/em><b>${I.f}<\/b><\/span><span>${icon('target',16)}<em>ตำแหน่ง<\/em><b>${[...new Set(p.steps.map(s=>regName(s.pts)))].join(' → ')}<\/b><\/span><span>${icon('bulb',16)}<em>กลไก<\/em><b>NIR → ไมโทคอนเดรีย (CCO) → ATP · การกะพริบ → คลื่นสมอง<\/b><\/span><\/div>\n  <p class=\"pa-e\">${E[1]}<\/p>\n  <details class=\"pa-ref\"><summary>อ้างอิง ${rs.length}<\/summary><ol>${rs.map(k=>`<li>${PREF[k]}<\/li>`).join('')}<\/ol><\/details>\n  <p class=\"pa-d\">ใช้เพื่อเสริมสุขภาวะ ไม่ใช่การรักษาโรค ถ้ามีภาวะทางการแพทย์หรือเป็นโรคลมชัก ควรปรึกษาแพทย์ก่อน<\/p>`}\n/* ---------- program builder: one card per step, simple choices first, details tucked away ---------- */\nconst BA={whole:['Whole head',PTS],front:['Front',['Fp1','Fp2','F7','F3','Fz','F4','F8']],back:['Back',['T5','P3','Pz','P4','T6','O1','O2']],limbic:['Limbic',['Fp1','Fp2','O1','O2']]};\nconst areaOf=pts=>{const e=Object.entries(BA).find(([,v])=>v[1].length===pts.length&&v[1].every(x=>pts.includes(x)));return e?e[0]:'custom'};\nconst areaName=pts=>{const k=areaOf(pts);return k==='custom'?`Custom · ${pts.length} จุด`:BA[k][0]};\nconst autoLabel=s=>`${areaName(s.pts)} · ${s.mode==='sweep'?`${s.f1}→${s.f2} Hz`:s.mode==='cross'?`${s.f}+${s.fb} Hz`:`${s.f} Hz`}`;\nlet openCustom=false;\nfunction renderBuild(){const p=draft;$('b-name').value=p.name;$('b-name').oninput=()=>p.name=$('b-name').value;\n  $('b-total').textContent=`${p.steps.length} step${p.steps.length>1?'s':''} · total ${fmtT(totalDur(p))}`;$('b-tline').innerHTML=tline(p,editIdx);\n  $('b-steps').innerHTML=p.steps.map((s,i)=>i===editIdx?editCard(s,i):`<button class=\"bcard\" data-open=\"${i}\"><span class=\"sn\">${i+1}<\/span><span class=\"sdot\" style=\"background:${stepCol(s)}\"><\/span><span class=\"sbody\"><b>${autoLabel(s)}<\/b><span>${fmtT(s.dur)} · ${s.P>=100?'Full':s.P<=50?'Gentle':s.P+'%'}<\/span><\/span><span class=\"chev\">›<\/span><\/button>`).join('');\n  $('b-steps').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{editIdx=+b.dataset.open;openCustom=false;renderBuild()});\n  bindEdit(p.steps[editIdx],editIdx);paintIcons($('v-build'))}\nfunction editCard(s,i){const ak=areaOf(s.pts),n=draft.steps.length;\n  return `<div class=\"ecard\"><div class=\"ec-h\"><span class=\"sn\">${i+1}<\/span><b>${autoLabel(s)}<\/b><span class=\"ec-a\"><button data-a=\"up\" ${i?'':'disabled'} aria-label=\"ขึ้น\">${icon('up',16)}<\/button><button data-a=\"dn\" ${i<n-1?'':'disabled'} aria-label=\"ลง\">${icon('dn',16)}<\/button><button data-a=\"dup\" aria-label=\"ทำซ้ำ\">${icon('copy',15)}<\/button><button data-a=\"del\" ${n>1?'':'disabled'} aria-label=\"ลบ\">${icon('trash',15)}<\/button><\/span><\/div>\n   <div class=\"ec-s\"><span class=\"lbl\">Area<\/span><div class=\"chipsx wrap\">${Object.entries(BA).map(([k,[l]])=>`<button data-area=\"${k}\" class=\"${ak===k?'on':''}\">${l}<\/button>`).join('')}<button data-area=\"custom\" class=\"${ak==='custom'||openCustom?'on':''}\">Custom…<\/button><\/div>\n     ${ak==='custom'||openCustom?`<div class=\"ph-map\">${headPBM({on:litOf(s.pts),sel:new Set(s.pts),click:true,size:220})}<\/div><div class=\"note\" style=\"text-align:center\">แตะจุดเพื่อเลือก / เอาออก<\/div>`:''}<\/div>\n   <div class=\"ec-s\"><div class=\"row between\"><span class=\"lbl\">Frequency<\/span><div class=\"seg mini\" data-g=\"mode\"><button data-v=\"fixed\" aria-pressed=\"${s.mode!=='sweep'}\">Fixed<\/button><button data-v=\"sweep\" aria-pressed=\"${s.mode==='sweep'}\">Sweep<\/button><\/div><\/div>\n     ${s.mode==='sweep'?`<div class=\"swrow\"><div><span class=\"note\">From<\/span><div data-st=\"f1\">${stepperHTML(s.f1,'Hz')}<\/div><\/div><span class=\"swarr\">→<\/span><div><span class=\"note\">To<\/span><div data-st=\"f2\">${stepperHTML(s.f2,'Hz')}<\/div><\/div><\/div><div class=\"chipsx wrap\">${QSW.map(([l,a,b])=>`<button data-sw=\"${a},${b}\" class=\"${s.f1===a&&s.f2===b?'on':''}\">${l}<\/button>`).join('')}<\/div>`\n       :`<div class=\"stepw\" data-st=\"f\">${stepperHTML(s.f,'Hz')}<\/div><div class=\"chipsx wrap\">${QB.map(([l,f])=>`<button data-f=\"${f}\" class=\"bchip ${s.f===f?'on':''}\" style=\"--bc:${bandCol(f)}\">${l} ${f}<\/button>`).join('')}<\/div>`}<\/div>\n   <div class=\"ec-row\"><div><span class=\"lbl\">Duration<\/span><div data-st=\"dur\">${stepperHTML(Math.round(s.dur/60),'min')}<\/div><\/div><div><span class=\"lbl\">Power<\/span><div class=\"seg mini\" data-g=\"P\ 2,min:10,pts:PTS,pat:'sync',duty:0},ls.get('nl_pbm_quick',{}));if(!Array.isArray(QS.pts))QS.pts=[...PTS];\nconst qnum=(v,d)=>{v=Number(v);return isFinite(v)?clamp(v,1,FMAX):d};function qfix(){QS.f=qnum(QS.f,10);QS.f1=Math.round(qnum(QS.f1,8));QS.f2=Math.round(qnum(QS.f2,12));QS.min=Math.round(clamp(Number(QS.min)||10,1,60));if(QS.mode!=='sweep')QS.mode='fixed';if(!PAT[QS.pat])QS.pat='sync';QS.duty=QS.duty?clamp(Math.round(QS.duty/10)*10,10,90):0;QS.pts=QS.pts.filter(x=>PTS.includes(x))}qfix();\nconst bandName=f=>f<4?'Delta':f<8?'Theta':f<12?'Alpha':f<15?'SMR':f<30?'Beta':'Gamma';\nconst f2v=f=>Math.round(Math.log10(f)/2*1000),v2f=v=>{const f=Math.pow(10,v/1000*2);return f<10?Math.round(f*2)/2:Math.round(f)};\nfunction renderQuick(){const L=lvlNow(),cl=getCL(),sel=new Set(QS.pts);\n  $('q-map').innerHTML=headPBM({on:litOf(QS.pts),sel,click:true,size:240});$('q-cnt').innerHTML=`<b>${QS.pts.length}<\/b>/19 points`;\n  $('q-reg').innerHTML=regHTML(sel);$('q-rg').ontoggle=()=>{REG_OPEN=$('q-rg').open};$('q-reg').querySelectorAll('[data-rg]').forEach(b=>b.onclick=()=>{const pts=RGUIDE[+b.dataset.rg][2];QS.pts=PTS.filter(p=>pts.includes(p));saveQ()});\n  $('q-map').querySelectorAll('[data-pt]').forEach(c=>c.onclick=()=>{const n=c.dataset.pt;QS.pts=QS.pts.includes(n)?QS.pts.filter(x=>x!==n):PTS.filter(x=>x===n||QS.pts.includes(x));saveQ()});\n  $('q-mode').querySelectorAll('button').forEach(b=>{b.classList.toggle('on',QS.mode===b.dataset.v);b.onclick=()=>{QS.mode=b.dataset.v;saveQ()}});\n  if(QS.mode==='fixed'){$('q-freq').innerHTML=`<div class=\"qf\"><button class=\"qf-b\" data-d=\"-1\" aria-label=\"ลด\">−<\/button><div class=\"qf-v\"><b>${QS.f}<\/b><span>Hz · ${bandName(QS.f)}<\/span><\/div><button class=\"qf-b\" data-d=\"1\" aria-label=\"เพิ่ม\">+<\/button><\/div>\n      <input type=\"range\" class=\"qslide\" id=\"q-slide\" min=\"0\" max=\"1000\" value=\"${f2v(QS.f)}\" aria-label=\"ความถี่\"><div class=\"qscale\"><span>1<\/span><span>4<\/span><span>8<\/span><span>13<\/sp set.f;saveQ()});$('q-freq').querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{const [a,c]=b.dataset.sw.split(',').map(Number);QS.f1=a;QS.f2=c;saveQ()});\n  $('q-dur').innerHTML=stepperHTML(QS.min,'min');bindStepper($('q-dur'),QS.min,1,60,v=>{QS.min=v;saveQ()});\n  const pro=S.mode==='pro';$('q-duty-row').hidden=!pro;\n  if(pro){    $('q-duty').innerHTML=stepperHTML(QS.duty||S.spec.duty,'%');bindStepper($('q-duty'),QS.duty||S.spec.duty,10,90,v=>{QS.duty=v;saveQ()},10)}\n  $('q-lvl').innerHTML=lvlHTML(L);if(S.mode==='pro')bindStepper($('q-lvl'),L,1,10,v=>{setLvl(v);renderQuick()});clBtn($('q-cl'),cl,v=>clGate(v,renderQuick));\n  const ft=QS.mode==='sweep'?`${QS.f1}→${QS.f2} Hz`:`${QS.f} Hz`,ok=QS.pts.length>0;$('q-go').disabled=!ok;$('q-go').innerHTML=ok?`Start <span class=\"hmin\">${ft} · ${Math.round(QS.min+(cl?clExtra([{dur:QS.min*60}])/60:0))} min<\/span>`:'เลือกจุดก่อน'}\n$('q-all').onclick=()=>{QS.pts=[...PTS];saveQ()};$('q-none').onclick=()=>{QS.pts=[];saveQ()};\n/* region guide (collapsed by default): tap a region to select its points */\nlet REG_OPEN=false;\nconst RGUIDE=[['Frontal','#8A5BC0',['Fp1','Fp2','F7','F3','Fz','F4','F8'],'Executive function, decision making, inhibition, working memory'],\n  ['Midline','#5E86C9',['Fz','Cz','Pz'],'Cognitive flexibility, processing speed, complex attention'],\n  ['Central','#3F7FD0',['C3','Cz','C4'],'Planning and control of balance and voluntary movement'],\n  ['Temporal','#6FA85A',['T3','T4','T5','T6'],'Auditory processing, memory, speech, language, emotion'],\n  ['Parietal','#E8833A',['P3','Pz','P4'],'Sensory integration, vigilance, calculation, self-awareness'],\n  ['Limbic','#E0708A',['Fp1','Fp2','O1','O2'],'Autonomic regulation, motivation, social-emotional processing'],\n  ['Occipital','#D2455B',['O1','O2'],'Visual processing, spatial orientation, memory encoding']];\nfunction regHTML(sel){return `<details class=\"bguide rguide\" id=\"q-rg\" ${REG_OPEN?'open':''}><summary><span>Region guide<\/span><span cla "/>',\n star:'<path d=\"M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z\"/>',\n up:'<path d=\"M6 15l6-6 6 6\"/>',dn:'<path d=\"M6 9l6 6 6-6\"/>',\n sword:'<path d=\"M14.5 4H20v5.5L10 19.5 4.5 14z\"/><path d=\"M7 13l4 4M5 19l-1.5 1.5\"/>',\n ufo:'<ellipse cx=\"12\" cy=\"13\" rx=\"9\" ry=\"3.5\"/><path d=\"M7.5 11.5a4.5 4.5 0 0 1 9 0\"/><path d=\"M8 17l-1.5 3M16 17l1.5 3\"/>',\n jet:'<path d=\"M12 2.5l2 7 7 4.5v2l-7-2-.5 5 2.5 2v1.5l-4-1-4 1V21l2.5-2-.5-5-7 2v-2l7-4.5z\"/>',\n batt:'<rect x=\"3\" y=\"7\" width=\"16\" height=\"10\" rx=\"2\"/><path d=\"M21 10.5v3\"/>',\n wave:'<path d=\"M2 12c2-4 3.5-4 5 0s3 4 5 0 3-4 5 0 3 4 5 0\"/>'});\n\n/* ---------- age bands (session plan) ---------- */\nconst BANDS=[\n {id:'pre',label:'อนุบาล 3–5 ปี',min:3,max:5,rounds:4,rmin:1.5,rest:30,base:45,hold:.25},\n {id:'early',label:'ประถมต้น 6–7 ปี',min:6,max:7,rounds:4,rmin:2,rest:30,base:60,hold:.5},\n {id:'school',label:'วัยเรียน 8–12 ปี',min:8,max:12,rounds:5,rmin:3,rest:30,base:60,hold:.5},\n {id:'teen',label:'วัยรุ่น 13–17 ปี',min:13,max:17,rounds:6,rmin:3,rest:30,base:60,hold:.5},\n {id:'adult',label:'ผู้ใหญ่ 18–59 ปี',min:18,max:59,rounds:6,rmin:4,rest:30,base:60,hold:1},\n {id:'senior',label:'ผู้สูงอายุ 60+ ปี',min:60,max:110,rounds:5,rmin:3,rest:40,base:60,hold:.5}];\nconst bandOf=a=>BANDS.find(b=>a>=b.min&&a<=b.max)||BANDS[2];\nconst ageNow=()=>clamp(+$('f-age').value||8,3,110);\nconst B=()=>bandOf(ageNow());\nfunction plan(){const b=B(),d=S.speed==='demo',tot=S.dur==='age'?b.rounds*b.rmin:+S.dur,rounds=Math.max(1,Math.round(tot/b.rmin));return {rounds,round:d?Math.max(12,Math.round(b.rmin*6)):b.rmin*60,rest:d?6:b.rest,base:d?10:b.base,tot}}\n\n/* ---------- protocols ---------- */\nconst BCOL={theta:'#7A5BC9',alpha:'#2A8C82',a1:'#3E9E92',a2:'#2AA0B8',smr:'#4FA36B',beta:'#D89A1E',b1:'#D89A1E',hbeta:'#C2563A'};\nconst BN={theta:'Theta',alpha:'Alpha',a1:'Alpha 1',a2:'Alpha 2',smr:'SMR',beta:'Beta',b1:'Beta',hbeta:'High Beta'};\nconst BHZ={theta:'4–8',alpha:'8–12',a1:'8–10',a2:'10–12',smr:'12–15',beta:'13–21',b1:'15–18',hbeta:'21–30'};\nconst PROTO={\n faa:{k:'faa',main:true,name:'Frontal Alpha Asymmetry',kid:'Frontal Alpha Asymmetry',en:'FAA',ch:['F3','F4'],tags:['กำกับอารมณ์','คลายกังวล'],eyes:['eo','ec'],\n   tiles:[{b:'theta',d:-1},{b:'faa',d:1},{b:'hbeta',d:-1}],rew:{d:1,unit:'',fmt:v=>(v>=0?'+':'')+v.toFixed(2),lbl:'FAA'},inhib:['theta','hbeta'],\n   what:'ฝึกให้สมองซีกหน้าซ้ายทำงานเด่นขึ้นเล็กน้อย (อัลฟา F4 มากกว่า F3) สัมพันธ์กับอารมณ์เชิงบวกและการเข้าหา',formula:'FAA = ln α(F4) − ln α(F3) · รางวัลเมื่อสูงกว่าเกณฑ์ · กด θ และ high-β ที่ F3/F4'},\n tbr:{k:'tbr',name:'Theta/Beta Ratio',kid:'Theta/Beta Ratio',en:'TBR',ch:['Fz'],tags:['สมาธิ','ลดเหม่อ'],eyes:['eo','ec'],\n   tiles:[{b:'tbr',d:-1},{b:'hbeta',d:-1}],rew:{d:-1,unit:'',fmt:v=>v.toFixed(2),lbl:'TBR'},inhib:['hbeta'],\n   what:'ลดสัดส่วนคลื่นช้า (θ) เทียบคลื่นเร็ว (β) ที่หน้าผากกลาง ใช้มากในงานด้านสมาธิและสมาธิสั้น',formula:'TBR = θ(4–8) / β(13–21) ที่ Fz · รางวัลเมื่อต่ำกว่าเกณฑ์ · กด high-β'},\n smr:{k:'smr',name:'SMR Center',kid:'SMR Center',en:'Sensorimotor Rhythm',ch:['Cz'],tags:['ความสงบ','โฟกัส'],eyes:['eo'],\n   tiles:[{b:'theta',d:-1},{b:'alpha',d:-1},{b:'smr',d:1},{b:'hbeta',d:-1}],rew:{d:1,unit:'µV²',fmt:v=>v.toFixed(2),lbl:'SMR'},inhib:['theta','alpha','hbeta'],\n   what:'เพิ่มคลื่น SMR ที่กลางศีรษะ สภาวะ \"ตัวนิ่ง ใจตื่น\" ช่วยคุมตัวเอง ลดอยู่ไม่นิ่ง และช่วยเรื่องการนอน',formula:'รางวัล SMR(12–15) ที่ Cz สูงกว่าเกณฑ์ · กด θ, α, high-β'},\n fa:{k:'fa',name:'Frontal Activation',kid:'Frontal Activation',en:'Frontal Beta',ch:['Fz'],tags:['ตื่นตัว','คิดเร็ว'],eyes:['eo','ec'],\n   tiles:[{b:'theta',d:-1},{b:'alpha',d:-1},{b:'b1',d:1},{b:'hbeta',d:-1}],rew:{d:1,unit:'µV²',fmt:v=>v.toFixed(2),lbl:'β 15–18'},inhib:['theta','alpha','hbeta'],\n   what:'เพิ่มเบต้าต่ำ (15–18 Hz) ที่หน้าผากกลาง ปลุกความตื่นตัว เหมาะกับคนที่ง่วง เฉื่อย หรือคิดช้าตอนทำงาน',formula:'รางวัล β(15–18) ที่ Fz สูงกว่าเกณฑ์ · กด θ, α, high-β'},\n upa:{k:'upa',name:'Upper A svg>`}\n/* o={act,z,title,sub,mains:{pct(0..1),txt,ok},fix:{n,msg,btn},btn:{id,txt,dis}} */\nfunction hsHTML(o){const els=[...o.act,'Ref','GND'],bad=els.filter(n=>hsLv(o.z[n])>0),ok=!bad.length&&o.mains.ok;\n  return `<div class=\"hsc\"><div class=\"hs-top\"><b>${o.title||'Headset check'}<\/b>${o.sub?`<span>${o.sub}<\/span>`:''}<\/div>${hsHead(o.act,o.z)}\n  <div class=\"hs-tiles\" style=\"grid-template-columns:repeat(${els.length},1fr)\">${els.map(n=>{const l=hsLv(o.z[n]);return `<span class=\"l${l}\"><b>${n}<\/b><i>${o.z[n]!=null?o.z[n].toFixed(1):'—'}<\/i><\/span>`}).join('')}<\/div>\n  <div class=\"hs-m\"><span>50 Hz<\/span><div class=\"bar\"><u style=\"width:${Math.round(Math.min(1,Math.max(.04,o.mains.pct))*100)}%;background:${o.mains.ok?'var(--ok)':'var(--warn)'}\"><\/u><\/div><span class=\"mono\">${o.mains.txt}<\/span><\/div>\n  <div class=\"hs-st ${ok?'ok':'wait'}\">${ok?'<b>✓<\/b><span>พร้อมแล้ว · ทุกขั้วต่ำกว่า 10 kΩ<\/span>':o.fix?`<b>!<\/b><span>${o.fix.msg}<\/span>${o.fix.btn?`<button class=\"hs-fx\" data-n=\"${o.fix.n}\">${o.fix.btn}<\/button>`:''}`:'<b>…<\/b><span>กำลังวัดค่าความต้านทาน รอให้ค่าลดลงต่ำกว่า 10 kΩ<\/span>'}<\/div>\n  <div class=\"hs-leg\"><span><i style=\"background:var(--ok)\"><\/i>&lt;10 kΩ<\/span><span><i style=\"background:var(--warn)\"><\/i>10–20<\/span><span><i style=\"background:var(--danger)\"><\/i>&gt;20<\/span><\/div><\/div>`}\nfunction hsFix(n,z,mainsOk){if(n==='hum'||!n)return mainsOk?null:{n:'hum',msg:'ไฟฟ้ารบกวน 50 Hz สูง · ถอดสายชาร์จ ห่างปลั๊กไฟ กดคลิปติ่งหู',btn:'แก้แล้ว'};\n  return {n,msg:`<b>${n}<\/b> ${z.toFixed(1)} kΩ · ${n==='Ref'?'หนีบคลิปติ่งหูให้แน่น':n==='GND'?'กดขั้วหน้าผากให้แนบ':'เลื่อนผมออก กดขั้วให้แนบหนังศีรษะ'}`,btn:'ปรับแล้ว'}}\n\n/* ---------- session-complete chime (shared) ---------- */\nfunction doneChime(){try{const A=window._dcA||(window._dcA=new (window.AudioContext||window.webkitAudioContext)());if(A.state==='suspended')A.resume();\n  const t0=A.currentTime+.05,out=A.createGain();out.gain.value=.22;out.connect(A.destination);\n  [[523.25,0],[659.25,.16],[783.99,.32],[1046.5,.5]].forEach(([f,d],i)=>{[1,2.01].forEach((m,j)=>{const o=A.createOscillator(),g=A.createGain(),t=t0+d,len=i===3?1.8:1.1;o.type='sine';o.frequency.value=f*m;\n    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(j?.08:.32,t+.015);g.gain.exponentialRampToValueAtTime(.0004,t+len);o.connect(g).connect(out);o.start(t);o.stop(t+len+.05)})});\n  if(navigator.vibrate)navigator.vibrate([60,60,120])}catch(e){}}\n\n/* ---------- headset check (compact; shares the per-user per-day key with other modules) ---------- */\nlet ck=null;\nfunction openCheck(next){if(ck&&ck.timer)clearInterval(ck.timer);const p=PROTO[SET.p],els=[...(next?p.ch:['F3','F4','Fz','Cz','Pz']),'GND','Ref'];\n  ck={next,els,z:{},tgt:{},hum:12,humT:Math.random()<.3?15:2.5,timer:null};els.forEach(n=>{ck.z[n]=20+Math.random()*20;ck.tgt[n]=3+Math.random()*4});if(Math.random()<.6)ck.tgt[els[Math.floor(Math.random()*els.length)]]=24;\n  ck.timer=setInterval(ckTick,300);go('check');ckRender()}\nfunction ckTick(){ck.els.forEach(n=>{ck.z[n]+=(ck.tgt[n]-ck.z[n])*.25+(Math.random()-.5)*.5});ck.hum+=(ck.humT-ck.hum)*.2+(Math.random()-.5)*.3;ck.hum=Math.max(.6,ck.hum);ckRender()}\nconst zl=z=>z<10?0:z<20?1:2;\nfunction ckRender(){const p=PROTO[SET.p],act=ck.els.filter(n=>n!=='GND'&&n!=='Ref'),hok=ck.hum<6,red=ck.els.find(n=>ck.z[n]>=20),amb=ck.els.find(n=>ck.z[n]>=10),zok=!amb;\n  const fix=red?hsFix(red,ck.z[red]):!hok?hsFix('hum',0,false):amb?{msg:`<b>${amb}<\/b> ${ck.z[amb].toFixed(1)} kΩ · กำลังลดลง รอสักครู่`}:null;\n  $('ck-hs').innerHTML=hsHTML({act,z:ck.z,title:'Headset check',sub:ck.next?`${act.join(' · ')} + Ref + GND · ${pName(p)}`:'เช็คครบ 5 ขั้ว',mains:{pct:ck.hum/20,txt:ck.hum.toFixed(1)+'%',ok:hok},fix});\n  $('ck-hs').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const n=b.dataset.n;if(n==='hum')ck.humT=2.5;else ck.tgt[n]=3+Math.random()*4});\n  const ok=zok&&hok;$('ck-go').disabled=!ok;$('ck-go').textContent=ok?(ck.next?'พร้อมแล้ว เริ่มฝึก':'เรียบร้อย'):'กำลังเช็ค…'}\n$('ck-go').onclick=()=>{const z={};ck.els.forEach(n=>z[n]=+ck.z[n].toFixed(1));const prev=lastChk()||{};try{localStorage.setItem(ckKey(),JSON.stringify({z:{...(prev.z||{}),...z},hum:+ck.hum.toFixed(1),ok:ck.els.length>=6||!!prev.ok,date:new Date().toISOString()}))}catch(e){}\n  clearInterval(ck.timer);ck.timer=null;if(ck.next)beginTraining();else go('home')};\n\n/* ---------- simulated EEG band powers (real device: Welch 2 s window, 0.25 s hop) ---------- */\nconst CHS=['F3','F4','Fz','Cz','Pz'],BK=['theta','alpha','smr','beta','b1','hbeta'];\nconst BASEP={theta:[6.5,6.5,8,7,6.2],alpha:[4.4,4.6,4.8,6,7.4],smr:[1.5,1.5,1.6,2,1.7],beta:[3.6,3.6,3.5,3.4,3.2],b1:[1.3,1.3,1.3,1.25,1.15],hbeta:[1.6,1.6,1.5,1.3,1.2]};\nconst SIM={f:.3,t:0,learn:0,art:0,emg:0,n:{},ph:{},buf:{}};\nfunction simReset(){SIM.f=.3;SIM.t=0;SIM.learn=0;SIM.art=0;SIM.emg=0;CHS.forEach((c,i)=>{BK.forEach(b=>SIM.n[c+b]=0);SIM.buf[c]=new Float32Array(750);SIM.ph[c]=[0,0,0,0,0]})}\nfunction simStep(dt,training){const ab=SIMC.abil/100,mv=SIMC.mov/100;SIM.t+=dt;\n  const tgt=clamp(.12+ab*.62+(training?SIM.learn:0)+.13*Math.sin(SIM.t/7)+.07*Math.sin(SIM.t/2.3),0,1);\n  SIM.f=clamp(SIM.f+(tgt-SIM.f)*.08+rn()*.045,0,1);if(Math.random()<.006)SIM.f*=.5;\n  if(SIM.art<=0&&Math.random()<mv*.03+.002)SIM.art=.6+Math.random()*.8;if(SIM.emg<=0&&Math.random()<mv*.02+.001)SIM.emg=.8+Math.random()*1.5;\n  SIM.art=Math.max(0,SIM.art-dt);SIM.emg=Math.max(0,SIM.emg-dt);\n  const f=SIM.f,ec=SET.eyes==='ec',faa=SET.p==='faa',pp=SET.p,P={};\n  CHS.forEach((c,i)=>{P[c]={};BK.forEach(b=>{const k=c+b;SIM.n[k]=.82*SIM.n[k]+.18*rn()*1.4;let v=BASEP[b][i]*Math.exp(.28*SIM.n[k]);\n    if(b==='theta')v*=pp==='at'&&c==='Pz'?.75+.55*f:1.3-.5*f;\n    if(b==='alpha'){v*=ec?2.2:1;if(faa){v*=c==='F4'?.88+.36*f:c==='F3'?1.12-.22*f:1}else if((pp==='pa'||pp==='at'||pp==='aw'||pp==='pr')&&c==='Pz')v*=.78+.5*f;else if((pp==='aw'||pp==='lfa')&&c==='F3')v*=1.15-.3*f;else if(pp==='upa'&&c==='Pz')v*=1;else v*=1.12-.28*f}\n    if(b==='smr')v*=.78+.5*f;if(b==='beta')v*=.85+.35*f;if(b==='b1')v*=.8+.5*f;if(b==='hbeta')v*=1.15-.25*f;\n    if(SIM.art>0&&c!=='Cz'&&c!=='Pz'&&(b==='theta'||b==='alpha'))v*=3.2;if(SIM.emg>0&&(b==='hbeta'||b==='b1'||b==='beta'))v*=b==='hbeta'?4.5:1.9;\n    P[c][b]=v});\n    /* alpha split: α1 8–10 / α2 10–12 (Upper Alpha trains α2 up, α1 down) */\n    const up=(pp==='upa'||pp==='smc')&&c==='Pz',lo=(pp==='pr'||pp==='at')&&c==='Pz';P[c].a1=P[c].alpha*.55*(up?1.12-.3*f:lo?.85+.3*f:1);P[c].a2=P[c].alpha*.45*(up?.72+.62*f:lo?1.2-.45*f:1)});\n  /* synthetic raw trace for the coach view only */\n  const nS=Math.round(dt*250),FR=[6,10,13.5,17,25];\n  CHS.forEach(c=>{const bf=SIM.buf[c];bf.copyWithin(0,nS);for(let s=0;s<nS;s++){let x=0;['theta','alpha','smr','beta','hbeta'].forEach((b,j)=>{SIM.ph[c][j]+=2*Math.PI*(FR[j]+Math.sin(SIM.t+j)*.6)/250;x+=Math.sqrt(P[c][b])*2.2*Math.sin(SIM.ph[c][j])});\n    x+=rn()*2;if(SIM.art>0&&c!=='Cz'&&c!=='Pz')x+=60*Math.sin(Math.PI*(1-SIM.art/1.4))*(c==='Fz'?.8:1);if(SIM.emg>0)x+=rn()*9;bf[750-nS+s]=x}});\n  return P}\nfunction metricOf(P,k){const p=PROTO[k];if(k==='upa')return P.Pz.a2;if(k==='pa')return P.Pz.alpha;if(k==='at')return P.Pz.theta+P.Pz.a1;if(k==='aw')return Math.log(P.Pz.alpha)-Math.log(P.F3.alpha);if(k==='lfa')return P.F3.beta;if(k==='smc')return P.Cz.smr+P.Pz.a2*.5;if(k==='pr')return P.Pz.a1;if(k==='faa')return Math.log(P.F4.alpha)-Math.log(P.F3.alpha);if(k==='tbr')return P.Fz.theta/P.Fz.beta;if(k==='smr')return P.Cz.smr;return P.Fz.b1}\nfunction inhibOf(P,k,b){const p=PROTO[k],ch=(p.ich&&p.ich[b])||p.ch;return ch.reduce((a,c)=>a+P[c][b],0)/ch.length}\n\n/* ---------- training engine ---------- */\nconst q=(a,p)=>{const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.max(0,Math.floor(p*(s.length-1))))]};\nconst sd=a=>{const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)||1e-3};\nconst effStyle=()=>S.style==='auto'?(ageNow()<8? nst xx=8+i*bw+bw*.2,w=bw*.6,c=BCOL[{faa:'alpha',tbr:'beta',smr:'smr',fa:'hbeta',upa:'a2',pa:'alpha',at:'theta',aw:'a1',lfa:'beta',smc:'smr',pr:'a1'}[x.p]];return `<rect x=\"${xx}\" y=\"${Y(x.pct)}\" width=\"${w}\" height=\"${Y(0)-Y(x.pct)}\" rx=\"4\" style=\"fill:${c}\"><title>${new Date(x.date).toLocaleDateString('th-TH')} · ${PROTO[x.p].name} · ${x.pct}%<\/title><\/rect><text x=\"${xx+w/2}\" y=\"${Y(x.pct)-4}\" text-anchor=\"middle\" style=\"fill:var(--ink);font-size:10px;font-family:var(--f-mono)\">${x.pct}<\/text><text x=\"${xx+w/2}\" y=\"${RH-6}\" text-anchor=\"middle\" style=\"fill:var(--muted);font-size:9px\">${new Date(x.date).getDate()}/${new Date(x.date).getMonth()+1}<\/text>`}).join('')}<\/svg>\n     <div class=\"bleg\">${PORDER.map(k=>`<span><i style=\"background:${BCOL[{faa:'alpha',tbr:'beta',smr:'smr',fa:'hbeta',upa:'a2',pa:'alpha',at:'theta',aw:'a1',lfa:'beta',smc:'smr',pr:'a1'}[k]]}\"><\/i>${PROTO[k].name}<\/span>`).join('')}<\/div>\n     <table class=\"mtab\"><tr><th>วันที่<\/th><th>โปรโตคอล<\/th><th>แบบ<\/th><th class=\"r\">ทำได้<\/th><th class=\"r\">เกณฑ์ เริ่ม→จบ<\/th><\/tr>${h.slice().reverse().map(x=>`<tr><td>${new Date(x.date).toLocaleDateString('th-TH',{day:'numeric',month:'short'})}<\/td><td>${PROTO[x.p].rew.lbl}${x.eyes==='ec'?' (หลับตา)':''}<\/td><td>${MODEI[x.mode][1]}<\/td><td class=\"r\">${x.pct}%<\/td><td class=\"r\">${PROTO[x.p].rew.fmt(x.thr0)}→${PROTO[x.p].rew.fmt(x.thr1)}<\/td><\/tr>`).join('')}<\/table>`}\n  $('c-proto').innerHTML=PORDER.map(k=>{const p=PROTO[k];return `<div class=\"cpr\"><b>${p.name}${p.main?' · หลัก':''}<\/b><span class=\"note\">${p.en} · ${p.ch.join('/')} · ${p.eyes.map(e=>e==='eo'?'ลืมตา':'หลับตา').join('/')}<\/span><span class=\"mono\" style=\"font-size:11.5px\">${p.formula}<\/span><\/div>`}).join('')+\n   `<div class=\"explain\"><span class=\"ico-s\" data-i=\"bulb\"><\/span><span>เกณฑ์เริ่มต้น: จากค่าเริ่มต้นก่อนฝึก ให้ผ่านได้ ~65% · เกณฑ์กด (inhibit): เปอร์เซ็นไทล์ที่ 90 ของค่าเริ่มต้น · ปรับเกณฑ์ทุก 15 s ทีละ 0.12 SD ให้ใกล้เป้าหมาย · รางวัลเมื่อผ่านเกณฑ์และไม่มีตัวกดเกินต่อเนื่องตามเวลาที่ตั้ง<\/span><\/div>`;\n  $('refs').innerHTML=`<ul class=\"interp\" style=\"font-size:12px\">\n   <li>แนวคิดโปรโตคอลและการจัดหน้าการ์ด อ้างอิงจากซอฟต์แวร์ BrainAssistant (ปรับให้เข้ากับหมวก 4 ช่อง F3 F4 Fz Cz)<\/li>\n   <li>Allen JJB, Harmon-Jones E, Cavender JH (2001). Manipulation of frontal EEG asymmetry through biofeedback alters self-reported emotional responses and facial EMG. <i>Psychophysiology<\/i> 38(4):685–693.<\/li>\n   <li>Baehr E, Rosenfeld JP, Baehr R (2001). Clinical use of an alpha asymmetry neurofeedback protocol in the treatment of mood disorders. <i>J Neurotherapy<\/i> 4(4):11–18.<\/li>\n   <li>Arns M, de Ridder S, Strehl U, Breteler M, Coenen A (2009). Efficacy of neurofeedback treatment in ADHD: a meta-analysis. <i>Clin EEG Neurosci<\/i> 40(3):180–189.<\/li>\n   <li>Sterman MB, Egner T (2006). Foundation and practice of neurofeedback for the treatment of epilepsy. <i>Appl Psychophysiol Biofeedback<\/i> 31(1):21–35.<\/li>\n   <li>Egner T, Gruzelier JH (2004). EEG biofeedback of low beta band components: frequency-specific effects on variables of attention and event-related brain potentials. <i>Clin Neurophysiol<\/i> 115(1):131–139.<\/li>\n   <li>Enriquez-Geppert S, Huster RJ, Herrmann CS (2017). EEG-neurofeedback as a tool to modulate cognition and behavior: a review tutorial. <i>Front Hum Neurosci<\/i> 11:51.<\/li>\n   <li>Ros T, et al. (2020). Consensus on the reporting and experimental design of clinical and cognitive-behavioural neurofeedback studies (CRED-nf checklist). <i>Brain<\/i> 143(6):1674–1685.<\/li><\/ul>\n   <span class=\"note\">ค่าเกณฑ์และระยะเวลาเป็นค่าต้นแบบ ต้องปรับจากข้อมูลจริงก่อนใช้งานทางคลินิก<\/span>`;\n  paintIcons($('v-coach'))}\n\n/* ---------- init ---------- */\npaintIcons();syncSim();setProfile((()=>{try{return localStorage.getItem('nl_cur')||'P-001'}catch(e){return 'P-001'}})());go('home');idleCar();applyRole();\n\n/* ---------- nature soundscape (replaces the synth pad): ambience + birds, brighter & livelier as the brain hits target ---------- */\nconst SNDS={forest:['ป่า','leaf','นกร้องในป่า','nat'],stream:['ลำธาร','wave','น้ำไหลเบา ๆ','nat'],rain:['ฝน','moon','ฝนปรอย','nat'],sea:['ทะเล','wave','คลื่นซัดฝั่ง','nat'],\n bowl:['ชามร้องเพลง','bulb','เสียงกังวาน','mus'],piano:['เปียโน','smile','ช้า ๆ สบาย ๆ','mus'],guitar:['กีตาร์','smile','กีตาร์โปร่ง','mus'],calm1:['Calm 1','leaf','ดนตรีสงบ','mus'],calm2:['Calm 2','leaf','ดนตรีสงบ','mus'],calm3:['Calm 3','leaf','ดนตรีสงบ','mus']};\nconst SND_SYN={forest:'forest',stream:'forest',rain:'rain',sea:'sea'},NBUF={};\nfunction sndBuf(k){if(!NBUF[k])NBUF[k]=fetch('audio/'+k+'.mp3').then(r=>{if(!r.ok)throw new Error('http');return r.arrayBuffer()}).then(a=>new Promise((res,rej)=>ctx.decodeAudioData(a,res,rej))).catch(e=>{delete NBUF[k];throw e});return NBUF[k]}\nlet NAT=null;\nconst sndKind=()=>{let k='forest';try{k=localStorage.getItem('nl_nf_snd')||'forest'}catch(e){}return SNDS[k]?k:'forest'};\nfunction natNoise(sec,brown){const n=ctx.sampleRate*sec,b=ctx.createBuffer(2,n,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);let last=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(brown){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w*.5}}return b}\nfunction synthOn(sc){const T=ctx.currentTime,out=ctx.createGain();out.gain.value=0;out.connect(ctx.destination);\n  /* space: short feedback delay for a little air */\n  const dl=ctx.createDelay(1),fb=ctx.createGain(),wet=ctx.createGain();dl.delayTime.value=.17;fb.gain.value=.28;wet.gain.value=.22;dl.connect(fb).connect(dl);dl.connect(wet).connect(out);\n  const amb=ctx.createGain(),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1200;amb.connect(lp).connect(out);\n  const src=ctx.createBufferSource();src.buffer=natNoise(6,true);src.loop=true;\n  const nodes=[src];\n  if(sc==='forest'){/* soft distant brook: brown noise, low-passed, gently breathing */const lo=ctx.createBiquadFilter();lo.type='lowpass';lo.frequency.value=520;lo.Q.value=.3;const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=90;const g=ctx.createGain();g.gain.value=.38;src.connect(hp).connect(lo).connect(g).connect(amb);\n    const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.07;lg.gain.value=.07;lfo.connect(lg).connect(g.gain);lfo.start();nodes.push(lfo)}\n  else if(sc==='rain'){/* light rain on leaves: soft band of brown noise, no hiss */const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=350;const lo=ctx.createBiquadFilter();lo.type='lowpass';lo.frequency.value=2200;const g=ctx.createGain();g.gain.value=.5;src.connect(hp).connect(lo).connect(g).connect(amb)}\n  else {const lo=ctx.createBiquadFilter();lo.type='lowpass';lo.frequency.value=650;const g=ctx.createGain();g.gain.value=.25;src.connect(lo).connect(g).connect(amb);\n    const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.09;lg.gain.value=.22;lfo.connect(lg).connect(g.gain);lfo.start();nodes.push(lfo)}\n  src.start();\n  NAT={out,amb,lp,dl,nodes,sc,level:.3,vol:.1,tm:null,t0:ctx.currentTime};\n  NAT.tm=setInterval(natTick,220)}\nfunction padOn(kind){ensureCtx();padOff();const k=sndKind(),out=ctx.createGain();out.gain.value=0;out.connect(ctx.destination);const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.Q.value=.4;lp.connect(out);\n  const me={file:1,k,out,lp,nodes:[],tm:null,level:.3,vol:.1,t0:ctx.currentTime,mus:SNDS[k][3]==='mus'};NAT=me;\n  sndBuf(k).then(buf=>{if(NAT!==me)return;const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;src.loopStart=.03;src.loopEnd=buf.duration-.03;src.connect(lp);src.start(0,me.mus?0:Math.random()*buf.duration*.8);me.nodes.push(src)})\n   .catch(()=>{if(NAT!==me)return;NAT=null;out.disconnect();synthOn(SND_SYN[k]||'forest');padSet(me.vol,me.level)})}\nfunction natTick(){if(!NAT||!ctx)return;const L=NAT.level,sc=NAT.sc;\n  if(sc==='rain'&&Math.random()<.06+.12*L)drop();\n  const pb=(sc==='forest'?.04+.32*L:sc==='rain'?.01+.08*L:.01+.06*L)*(L<.15?.3:1);\n  if(Math.random()<pb)bird(sc==='sea'?'gull':null)}\nfunction voice(){const g=ctx.createGain(),p=ctx.createStereoPanner?ctx.createStereoPanner():null;if(p){p.pan.value=Math.random()*1.6-.8;g.connect(p).connect(NAT.out);p.connect(NAT.dl)}else{g.connect(NAT.out);g.connect(NAT.dl)}return g}\nfunction bird(type){const T=ctx.currentTime+.02,g=voice(),v=.035+.05*NAT.level,k=type||['chirp','chirp','trill','whistle','warble'][Math.floor(Math.random()*5)];\n  const note=(t,f0,f1,d,a=v)=>{const o=ctx.createOscillator(),e=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(a,t+d*.15);e.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(e).connect(g);o.start(t);o.stop(t+d+.02)};\n  if(k==='chirp'){const n=2+Math.floor(Math.random()*4),f=2600+Math.random()*1800;for(let i=0;i<n;i++)note(T+i*.13,f*1.25,f*.8,.09)}\n  else if(k==='whistle'){const f=1700+Math.random()*600;note(T,f,f*1.02,.32);note(T+.38,f*1.33,f*1.3,.4)}\n  else if(k==='warble'){const f=2200+Math.random()*900;for(let i=0;i<6;i++)note(T+i*.075,f*(i%2?1.18:1),f*(i%2?1.08:1.12),.07,v*.8)}\n  else if(k==='gull'){const f=900+Math.random()*250;for(let i=0;i<3;i++)note(T+i*.32,f*1.5,f*.85,.26,v*.6)}\n  else {const o=ctx.createOscillator(),m=ctx.createOscillator(),mg=ctx.createGain(),e=ctx.createGain(),f=3200+Math.random()*900,d=.5+Math.random()*.4;o.frequency.value=f;m.frequency.value=28+Math.random()*25;mg.gain.value=350;m.connect(mg).connect(o.frequency);\n    e.gain.setValueAtTime(0,T);e.gain.linearRampToValueAtTime(v*.7,T+.05);e.gain.setValueAtTime(v*.7,T+d-.1);e.gain.linearRampToValueAtTime(0,T+d);o.connect(e).connect(g);o.start(T);m.start(T);o.stop(T+d+.05);m.stop(T+d+.05)}}\nfunction drop(){const T=ctx.currentTime+.01,o=ctx.createOscillator(),e=ctx.createGain(),f=700+Math.random()*700;o.type='sine';o.frequency.setValueAtTime(f*1.3,T);o.frequency.exponentialRampToValueAtTime(f,T+.06);e.gain.setValueAtTime(0,T);e.gain.linearRampToValueAtTime(.006*(.5+NAT.level),T+.01);e.gain.exponentialRampToValueAtTime(.0003,T+.12);o.connect(e).connect(NAT.out);o.connect(e);e.connect(NAT.dl);o.start(T);o.stop(T+.14)}\nfunction padSet(vol,bright){if(!NAT)return;NAT.level=Math.max(0,Math.min(1,bright));NAT.vol=vol;const t=ctx.currentTime;if(NAT.file){const L=NAT.level;NAT.out.gain.setTargetAtTime(vol<=0?0:Math.min(.85,.22+vol*3.4),t,t-NAT.t0<3?1.2:.5);NAT.lp.frequency.setTargetAtTime(NAT.mus?380+Math.pow(L,1.3)*9000:600+Math.pow(L,1.2)*9000,t,.5);return}\n  NAT.out.gain.setTargetAtTime(vol<=0?0:Math.min(.7,.14+vol*2.6),t,t-NAT.t0<3?1.2:.5);NAT.lp.frequency.setTargetAtTime(300+NAT.level*2600,t,.6)}\nfunction padOff(){if(!NAT)return;const n=NAT;NAT=null;if(n.tm)clearInterval(n.tm);n.out.gain.setTargetAtTime(0,ctx.currentTime,.15);setTimeout(()=>n.nodes.forEach(x=>{try{x.stop()}catch(e){}}),600)}\nfunction sndPreview(){padOn('ec');padSet(.12,.85);clearTimeout(sndPreview.t);sndPreview.t=setTimeout(()=>{if(!TR)padOff()},7000)}\n\n/* ---------- protocol evidence: why it works, key findings, references ---------- */\nconst NREF={\n arns09:'Arns M, de Ridder S, Strehl U, Breteler M, Coenen A (2009) Efficacy of neurofeedback treatment in ADHD: the effects on inattention, impulsivity and hyperactivity: a meta-analysis. Clin EEG Neurosci 40:180–189.',\n arns20:'Arns M, Clark CR, Trullinger M, deBeus R, Mack M, Aniftos M (2020) Neurofeedback and attention-deficit/hyperactivity-disorder (ADHD) in children: rating the evidence and proposed guidelines. Appl Psychophysiol Biofeedback 45:39–48.',\n vandoren:'Van Doren J, et al. (2019) Sustained effects of neurofeedback in ADHD: a systematic review and meta-analysis. Eur Child Adolesc Psychiatry 28:293–305.',\n nfcg21:'Neurofeedback Collaborative Group (2021) Double-blind placebo-controlled randomized clinical trial of neurofeedback for ADHD with a-label','BrainSTEM');\nbar.innerHTML=T.map(function(x){return '<button data-t=\"'+x[0]+'\" class=\"'+(x[0]===P?'on':'')+'\">'+(x[0]==='home'?'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z\"/><\/svg>':'<b>'+x[0]+'<\/b>')+'<em>'+x[1]+'<\/em><\/button>'}).join('');\nbar.addEventListener('click',function(e){var b=e.target.closest('button');if(b)parent.postMessage({bs:'tab',t:b.dataset.t},'*')});\nvar sc=document.querySelector('.screen');if(sc){sc.appendChild(bar)}else document.body.appendChild(bar);\ndocument.body.classList.add('bs-pad');\n/* one clock with BrainSTEM */\nvar st0=document.querySelector('.status');var ck=st0&&st0.firstElementChild;function tick(){try{var c=parent.document.getElementById('clock');if(ck&&c)ck.textContent=c.textContent}catch(e){}}tick();setInterval(tick,5000);\n/* deep links from BrainSTEM home: #quick or #prog=<id> */\nvar h=window.BS_HASH||location.hash.slice(1);setTimeout(function(){try{if(h==='quick'){var f=document.getElementById('fab');f&&f.click()}else if(h.indexOf('prog=')===0&&typeof openProg==='function')openProg(decodeURIComponent(h.slice(5)));else if(h.indexOf('proto=')===0&&typeof openProto==='function')openProto(h.slice(6));else if(h==='check'&&typeof openCheck==='function')openCheck(false);else if(h==='dev'&&typeof openDev==='function')openDev()}catch(e){}},60);\n/* hide the tab bar while a session is running, like BrainSTEM does */\nvar BUSY=['#run','#stage','#v-live','#v-check','#v-run','#v-break','#tr-play'];\nvar at=document.getElementById('apptitle'),HN=P==='S'?'PBM':'Neurofeedback';if(at)at.addEventListener('click',function(){if(at.classList.contains('bsw'))parent.postMessage({bs:'tab',t:'home'},'*')});\nfunction wmk(){if(!at)return;var hv=document.getElementById('v-home'),home=hv&&!hv.hidden;if(home&&!at.classList.contains('bsw')){at.classList.add('bsw');at.inner
