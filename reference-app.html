const icon=(k,sz=24)=>`<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]||''}</svg>`;
function paintIcons(root=document){root.querySelectorAll('[data-i]').forEach(e=>{if(!e.dataset.done){e.innerHTML=icon(e.dataset.i,e.classList.contains('ico-s')?16:24);e.dataset.done=1}})}

/* ---------- profiles (shared with every module: nl_profiles / nl_cur) ---------- */
const AVC=['#2F64AD','#D9533F','#6E4FC0','#1F8277','#B07A10','#B5487A'];
function profiles(){let p=ls.get('nl_profiles',null);if(!Array.isArray(p)||!p.length){p=[{id:'P-001',name:'น้องต้นกล้า',age:8,type:'kid'},{id:'P-002',name:'คุณสมศรี (ตัวอย่าง)',age:72,type:'care'}];ls.set('nl_profiles',p)}return p}
function curUser(){const ps=profiles(),id=ls.get('nl_cur',null);return ps.find(x=>x.id===id)||ps.find(x=>x.id===String(localStorage.getItem('nl_cur')))||ps[0]}
function setUser(id){try{localStorage.setItem('nl_cur',id)}catch(e){}renderWho();refresh()}
const avCol=u=>AVC[(profiles().findIndex(x=>x.id===u.id)+AVC.length)%AVC.length];
const first=n=>String(n||'?').replace(/^(น้อง|คุณ)/,'').trim().charAt(0)||'?';
function renderWho(){const u=curUser();$('who-av').textContent=first(u.name);$('who-av').style.background=avCol(u);$('who-n').textContent=u.name.replace(/\s*\(.*\)/,'')}
/* avatars: illustrated by default (age group + seeded hair/skin), or a photo taken on the device */
function avSVG(u){/* minimal default: soft head-and-shoulders silhouette, no facial detail; smaller head for kids */
  const kid=u.type!=='adult'&&u.type!=='care',r=kid?11:10,cy=kid?25:24;
  return `<svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="${cy}" r="${r}" fill="#fff" opacity=".9"/><path d="M${kid?13:11} 60c0-11 8-19 17-19h0c9 0 17 8 17 19z" fill="#fff" opacity=".9"/></svg>`}
function avHTML(u,cls=''){return u&&u.photo?`<span class="av ph ${cls}" data-raw><img src="${u.photo}" alt=""></span>`:`<span class="av ai ${cls}" data-raw style="background:${avCol(u)}">${avSVG(u||{})}</span>`}
function readPhoto(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)}
function saveProfile(id,patch){const ps=profiles(),p=ps.find(x=>x.id===id);if(!p)return;Object.assign(p,patch);if(patch.photo===null)delete p.photo;ls.set('nl_profiles',ps)}
function openProfiles(){const ps=profiles(),u=curUser(),acct=typeof auAcctHTML==='function';
  sheet(`<div class="sh-h"><h2>ผู้ใช้</h2><button class="btn sm" data-x>ปิด</button></div>${acct?auAcctHTML()+syRowHTML(u):''}
   <div class="plist">${ps.map(p=>`<button class="prow ${p.id===u.id?'on':''}" data-id="${esc(p.id)}">${avHTML(p)}<span class="t"><b data-raw>${esc(p.name)}</b><span class="note">${p.age} ปี · ${p.type==='kid'?'Kid':p.type==='care'?'Care':'Adult'} · ${esc(p.id)}${p.cloud?' · ออนไลน์':''}</span></span></button>`).join('')}</div>
   <div class="row"><button class="btn sm" id="pf-ed">แก้ไขข้อมูล ${esc(u.name)}</button><button class="btn sm" id="pf-add">+ เพิ่มผู้ใช้ใหม่</button></div>`);
  const si=$('sh-in');
  si.querySelectorAll('.prow').forEach(b=>b.onclick=()=>{setUser(b.dataset.id);closeSheet()});
  $('pf-ed').onclick=()=>{closeSheet();auProfile(u.id)};$('pf-add').onclick=()=>{closeSheet();auProfile(null)};if(acct){auBindAcct();syBindRow()}}

$('sheet').onclick=e=>{if(e.target===$('sheet'))closeSheet()};

/* ---------- history across modules ---------- */
const H={
  eval:()=>ls.get('bs_eval_hist',[]).filter(h=>h.code===curUser().id),

  tr:()=>ls.get('nl_train_hist',[]).filter(h=>h.code===curUser().id)};
const NFN={faa:'Frontal Alpha Asymmetry',tbr:'Theta/Beta Ratio',smr:'SMR Center',fa:'Frontal Activation'};
const GN={rhythm:'Rhythm',gonogo:'Go/No-Go',car:'Car'};
function events(){const ev=[];
  H.pbm().forEach(h=>ev.push({p:'S',d:h.date,t:(h.items||[]).map(i=>i.name).join(' + ')||'PBM',v:Math.round((h.sec||0)/60)+' min',min:(h.sec||0)/60}));
  H.nf().forEach(h=>ev.push({p:'T',d:h.date,t:'NFB · '+(NFN[h.p]||h.p||''),v:(h.pct!=null?h.pct+'%':''),score:h.pct}));
  {const ss={};H.tr().forEach(h=>{if(h.set){if(ss[h.set]){const e=ss[h.set];e.k++;e.sum+=h.score||0;e.v=Math.round(e.sum/e.k)+'';e.t='P300 · '+(GN[h.game]||h.game)+' · ชุด '+e.k+' รอบ';return}const e={p:'T',d:h.date,t:'P300 · '+(GN[h.game]||h.game||'Game'),v:h.score!=null?h.score+'':'',k:1,sum:h.score||0};ss[h.set]=e;ev.push(e)}else ev.push({p:'T',d:h.date,t:'P300 · '+(GN[h.game]||h.game||'Game'),v:h.score!=null?h.score+'':''})})}
  H.p3().forEach(h=>ev.push({p:'T',d:h.date,t:'P300 · '+(h.kind==='assess'?'Check':'Daily'),v:h.lat?Math.round(h.lat)+' ms':''}));
  H.eval().forEach(h=>ev.push({p:'E',d:h.date,t:'Assessment · '+h.tasks.length+' tasks',v:h.idx!=null?h.idx+'':'',id:h.id}));
  return ev.filter(e=>e.d).sort((a,b)=>new Date(b.d)-new Date(a.d))}

function bindTL(root){root.querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>{const r=ls.get('bs_eval_hist',[]).find(x=>x.id===b.dataset.rep);if(r)showReport(r)})}

const TITLES={plan:'Schedule',set:'Settings',p3t:'P300 Training',game:'P300 Training',train:'Train',eval:'Evaluate',run:'Evaluate',rep:'Report',mon:'Map'};
function go(v,push=true){if(push&&NAV.view!==v)NAV.stack.push(NAV.view);NAV.view=v;
  document.querySelectorAll('.view').forEach(s=>s.hidden=s.id!=='v-'+v);

  $('title').innerHTML=v==='home'?wmHTML():TOPV?wmHTML(TOPV)+`<span class="wmsub">${TITLES[v]}</span>`:TITLES[v]||'';
  const full=v==='run'||v==='game';$('back').hidden=v==='home'||!!TOPV||full;$('gear').hidden=full||!(v==='home'||TOPV);$('who').hidden=true;$('tabbar').hidden=full;hchipRender(v);

/* ---------- session-complete chime (shared) ---------- */
function doneChime(){try{const A=window._dcA||(window._dcA=new (window.AudioContext||window.webkitAudioContext)());if(A.state==='suspended')A.resume();
  const t0=A.currentTime+.05,out=A.createGain();out.gain.value=.22;out.connect(A.destination);
  [[523.25,0],[659.25,.16],[783.99,.32],[1046.5,.5]].forEach(([f,d],i)=>{[1,2.01].forEach((m,j)=>{const o=A.createOscillator(),g=A.createGain(),t=t0+d,len=i===3?1.8:1.1;o.type='sine';o.frequency.value=f*m;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(j?.08:.32,t+.015);g.gain.exponentialRampToValueAtTime(.0004,t+len);o.connect(g).connect(out);o.start(t);o.stop(t+len+.05)})});

/* ===== Evaluate: DSP + simulated ADS1299 5-ch EEG (F3 F4 Fz Cz Pz, 250 Hz) ===== */
const FS=250,CH=['F3','F4','Fz','Cz','Pz'];
function rng(seed){let s=seed>>>0||1;return ()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
const hash=str=>{let h=2166136261;for(const c of String(str)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
/* in-place radix-2 FFT; inv divides by N */
function fft(re,im,inv=false){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}
  for(let len=2;len<=n;len<<=1){const a=(inv?2:-2)*Math.PI/len,wr=Math.cos(a),wi=Math.sin(a);for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<len/2;k++){const p=i+k,q=p+len/2,tr=re[q]*cr-im[q]*ci,ti=re[q]*ci+im[q]*cr;re[q]=re[p]-tr;im[q]=im[p]-ti;re[p]+=tr;im[p]+=ti;const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr}}}
  if(inv)for(let i=0;i<n;i++){re[i]/=n;im[i]/=n}}

/* age-referenced norms (prototype reference values, approximated from published developmental curves) */
const NORM={
  iapf:a=>[a<16?8.0+0.13*a:a<50?10.1:10.1-0.03*(a-50),0.9],
  expo:a=>[a<20?2.0-0.03*a:1.4-0.008*(a-20),0.25],
  lat:a=>[a<20?300+(20-a)*6:300+(a-20)*1.0,a<20?40:32],
  amp:a=>[a<20?15-0.17*(a-8):13-0.08*(a-20),5],
  rt:a=>{const m=a<20?380+(20-a)*18:380+(a-20)*2;return [m,m*.2]},
  rtcv:a=>[a<18?0.28-0.008*(a-8):0.2,0.06],
  dp:a=>[a<12?3.0:a<60?4.0:3.6,0.75],
  tbr:a=>[a<18?1.6+0.27*(18-a):a<60?1.6:1.1,a<18?1.3:a<60?0.5:0.45],
  react:a=>[a<16?2.1:a<60?2.0:1.25,a<60?0.7:0.45],
  faa:a=>[0.0,0.12],
  hib:a=>[a<16?0.015:a<60?0.025:0.045,a<16?0.008:0.013],
  cacc:a=>[0.95,0.07],
  mth:a=>[a<16?20:15,a<16?14:12], mal:a=>[-12,10],
  vlat:a=>{const [m,s]=NORM.lat(a);return [m+22,s]},vamp:a=>{const [m,s]=NORM.amp(a);return [m*1.1,s]},vrt:a=>{const [m,s]=NORM.rt(a);return [m*0.95,s*0.95]},vdp:a=>NORM.dp(a),
  lapse:a=>[a<14?0.15:a<60?0.06:0.09,a<14?0.08:0.05]};

/* person model: seeded by profile so repeat tests are consistent but not identical */
function brainOf(u){const r=rng(hash(u.id+'|brain')),a=u.age||20,z=()=>clamp(gauss(r),-2.2,2.2);
  const kid=a<16,old=a>=60;
  return {a,kid,old,
    iapf:NORM.iapf(a)[0]+z()*0.7, expo:NORM.expo(a)[0]+z()*0.18,
    pow:kid?2.2:old?0.75:1, theta:(kid?2.1:old?1.05:1)*(1+z()*0.22), alphaEO:(kid?0.9:old?0.75:1)*(1+z()*0.25),
    react:clamp((old?2.6:3.3)*(1+z()*0.28),1.3,6), faa:z()*0.09, hib:1+z()*0.25,
    lat:NORM.lat(a)[0]+z()*22, amp:NORM.amp(a)[0]*(1+z()*0.22), rt:NORM.rt(a)[0]*(1+z()*0.14),vlat:22+z()*10,vrt:0.95+z()*0.04, rtsd:0.16+(kid?0.08:0)+Math.abs(z())*0.04,
    hit:clamp(0.95-(kid?0.05:0)+z()*0.025,0.7,0.995), fa:clamp(0.015+(kid?0.015:0)+Math.abs(z())*0.008,0.002,0.12),
    blink:(kid?14:9)*(1+z()*0.2), mth:1.32+z()*0.12, steps:(kid?5:old?6:11)*(1+z()*0.2)}}

/* condition → per-channel PSD (µV²/Hz) */
function psdModel(B,cond,ch,f){if(f<0.3)return 0;
  const ap=28*B.pow*Math.pow(f,-B.expo)*(f<1?f:1);
  let aA=2.6*B.alphaEO*B.pow*(B.kid?0.8:1),tA=2.0*B.theta*B.pow,bA=0.16*B.pow,hb=0.05*B.pow*B.hib;
  if(cond==='ec'){aA*=B.react;tA*=1.08}
  if(cond==='erp'){aA*=0.8}
  if(cond==='ma'){aA*=0.72;bA*=1.18;if(ch==='Fz'||ch==='F3'||ch==='F4')tA*=(ch==='Fz'?B.mth:1+(B.mth-1)*0.6)}
  const cg={F3:[0.66*Math.exp(-B.faa),1.0],F4:[0.66*Math.exp(B.faa),1.0],Fz:[0.72,1.12],Cz:[1,1],Pz:[1.3,0.85]}[ch];
  return ap+aA*cg[0]*Math.exp(-((f-B.iapf)**2)/(2*0.9**2))+tA*cg[1]*Math.exp(-((f-6)**2)/(2*1.3**2))+bA*Math.exp(-((f-19)**2)/(2*4**2))+hb*Math.exp(-((f-27)**2)/(2*2.5**2))}

/* synthesize one task: returns {x:[4][N], art:[intervals]} */
function synth(B,cond,sec,seed,erp){const r=rng(seed),N=Math.round(sec*FS);let M=1;while(M<N)M<<=1;
  const cre=new Float64Array(M),cim=new Float64Array(M);for(let k=0;k<M;k++){cre[k]=gauss(r);cim[k]=gauss(r)}
  const x=CH.map(ch=>{const re=new Float64Array(M),im=new Float64Array(M);
    for(let k=1;k<M/2;k++){const f=k*FS/M,a=Math.sqrt(psdModel(B,cond,ch,f)*FS*M/2)/Math.SQRT2;
      const zr=0.72*cre[k]+0.69*gauss(r),zi=0.72*cim[k]+0.69*gauss(r);re[k]=a*zr;im[k]=a*zi;re[M-k]=re[k];im[M-k]=-im[k]}
    fft(re,im,true);return Float32Array.from(re.subarray(0,N))});
  const art=[];
  /* 50 Hz mains (small, shielded) */
  const mains=0.6+r()*0.5;for(let c=0;c<CH.length;c++){const ph=r()*6.28;for(let n=0;n<N;n++)x[c][n]+=mains*Math.sin(2*Math.PI*50*n/FS+ph)}
  /* blinks (frontal) and occasional muscle bursts */
  const bl=cond==='ec'&&!B.ecOpen?0.5:cond==='ma'?B.blink*0.7:cond==='erp'?B.blink*0.6:B.blink;let t=1+r()*3;
  while(t<sec-1){const n0=Math.round(t*FS),A=80+r()*90;for(let n=0;n<100&&n0+n<N;n++){const v=A*Math.sin(Math.PI*n/100)**2;x[0][n0+n]+=v*0.8;x[1][n0+n]+=v*0.8;x[2][n0+n]+=v;x[3][n0+n]+=v*0.3;if(x[4])x[4][n0+n]+=v*0.12}art.push([t,t+0.4]);t+=60/bl*(0.5+r())}
  const mus=(B.kid?2.2:1)*(cond==='ec'?0.4:1);t=8+r()*20;
  while(t<sec-2){const n0=Math.round(t*FS),L=Math.round((0.4+r()*0.8)*FS),c=r()<0.5?0:1;for(let n=0;n<L&&n0+n<N;n++){const v=(r()-0.5)*90*Math.sin(Math.PI*n/L);x[c][n0+n]+=v;x[2][n0+n]+=v*0.4}art.push([t,t+L/FS]);t+=60/mus*(0.5+r())}
  if(erp)addERP(B,x,erp,r);
  return {x,N,art}}

/* auditory oddball ERPs: N1/P2 to every tone, N2/P3 to targets */
function addERP(B,x,E,r){const W=[1,1,0.85,1.05,0.95],P3W=[0.55,0.6,0.8,1,1.2];
  E.stim.forEach(s=>{const n0=Math.round(s.t*FS),tgt=s.tg,lapse=tgt&&r()<0.1,ampScale=(E.resp==='count'?0.88:1)*(E.mod==='v'?1.1:1),vis=E.mod==='v';

    for(let c=0;c<CH.length&&!bad;c++){let mn=1e9,mx=-1e9;for(let n=s;n<s+L;n++){const v=x[c][n];if(v<mn)mn=v;if(v>mx)mx=v}if(mx-mn>150)bad=true}

/* ---- full pipeline (chunked so the UI can show progress) ---- */

    const half=i=>meanPSD(ok.filter((_,j)=>j%2===i)),A=half(0),B=half(1);let rs=0;for(let c=0;c<4;c++){const a=[],b=[];for(let q=2;q<=80;q++){a.push(Math.log10(A[c][q]));b.push(Math.log10(B[c][q]))}rs+=corr(a,b)/4}

    const ds=p=>Array.from({length:80},(_,i)=>+p[PS(p)][i+2].toFixed(3));res.curves.psd={eo:P.eo&&ds(P.eo),ec:P.ec&&ds(P.ec)};
    const fa=P.ec||P.eo;res.curves.topo=CH.map((_,c)=>+bandP(fa[c],BANDS.alpha).toFixed(2));res.curves.topoT=P.eo?CH.map((_,c)=>+bandP(P.eo[c],BANDS.theta).toFixed(2)):null;const RB=[[4,8],[8,13],[13,25],[25,30]],MK0=P.ma?'ma':P.ms?'ms':null;res.curves.rel={};['eo','ec',MK0].forEach(k=>{if(k&&P[k])res.curves.rel[k==='ms'?'ma':k]=CH.map((_,c)=>{const v=RB.map(b=>bandP(P[k][c],b)),t=v.reduce((x,y)=>x+y,0);return v.map(x=>+(x/t*100).toFixed(1))})})}
  const MK=P.ma?'ma':P.ms?'ms':null;if(MK&&P.eo&&W[MK]){const th=p=>bandP(p[FZ],BANDS.theta),al=p=>bandP(p[CZ],BANDS.alpha),PM=P[MK];res.m.mth=(th(PM)/th(P.eo)-1)*100;res.m.mal=(al(PM)/al(P.eo)-1)*100;
    const bs=[];for(let b=0;b<150;b++){const a=bootMeans(W[MK],r),e=W.eo?bootMeans(W.eo,r):P.eo;bs.push([(th(a)/th(e)-1)*100,(al(a)/al(e)-1)*100])}

  const E={};['p3a','p3s','p3v'].forEach(k=>{if(D[k]){E[k]=erpOf(D[k],r);const e=E[k];res.q[k]={clean:e.clean,r:e.r,n:e.nT,snr:e.snr,N:e.tot}}});
  const ek=Object.keys(E),aud=ek.filter(k=>k!=='p3v');if(aud.length){const av=f=>mean(aud.map(k=>f(E[k])));res.m.amp=av(e=>e.pk.amp);res.m.lat=av(e=>e.pk.lat);res.ci.amp=[av(e=>e.ciAmp[0]),av(e=>e.ciAmp[1])];res.ci.lat=[av(e=>e.ciLat[0]),av(e=>e.ciLat[1])]}
  if(E.p3v){const e=E.p3v;res.m.vamp=e.pk.amp;res.m.vlat=e.pk.lat;res.ci.vamp=e.ciAmp;res.ci.vlat=e.ciLat}
  if(ek.length){
    const ds=a=>Array.from({length:125},(_,i)=>+a[i*2].toFixed(2));res.curves.erp={};ek.forEach(k=>res.curves.erp[k]={t:ds(E[k].aT),s:ds(E[k].aS),se:ds(E[k].se),amp:+E[k].pk.amp.toFixed(1),lat:Math.round(E[k].pk.lat),nT:E[k].nT}) }
  onStep(3);await wait();
  if(D.p3a){const b=behavOf(D.p3a);res.beh.p3a={nT:b.nT,hits:b.hits,fa:b.fa,rts:b.rts.map(Math.round)};Object.assign(res.m,{dp:b.dp,rt:b.rt,rtcv:b.rtcv,lapse:b.lapse,com:b.com});
    if(b.rts.length>4){const bs=[];for(let i=0;i<200;i++){const s=Array.from({length:b.rts.length},()=>b.rts[Math.floor(r()*b.rts.length)]);bs.push([median(s),sd(s)/mean(s)])}res.ci.rt=[pct(bs.map(x=>x[0]),.025),pct(bs.map(x=>x[0]),.975)];res.ci.rtcv=[pct(bs.map(x=>x[1]),.025),pct(bs.map(x=>x[1]),.975)]}}
  if(D.p3v){const b=behavOf(D.p3v);res.beh.p3v={nT:b.nT,hits:b.hits,fa:b.fa,rts:b.rts.map(Math.round)};res.m.vdp=b.dp;res.m.vrt=b.rt;
    if(b.rts.length>4){const bs=[];for(let i=0;i<200;i++){const s=Array.from({length:b.rts.length},()=>b.rts[Math.floor(r()*b.rts.length)]);bs.push(median(s))}res.ci.vrt=[pct(bs,.025),pct(bs,.975)]}}
  if(D.p3s){const tr=D.p3s.seq.stim.filter(s=>s.tg).length,ans=D.p3s.count;res.beh.p3s={true:tr,ans};res.m.cacc=ans==null?NaN:clamp(1-Math.abs(ans-tr)/tr,0,1)}
  Object.keys(res.m).forEach(k=>{if(!Number.isFinite(res.m[k]))delete res.m[k]});
  /* validity: drop behaviour metrics of tasks the child did not actually do; flag metrics from partly-valid tasks */
  const V=res.v,BM={p3a:['dp','rt','rtcv','lapse','com'],p3v:['vdp','vrt'],ma:['macc','mrt']};Object.keys(BM).forEach(k=>{if(V[k]&&V[k].beh==='fail'){BM[k].forEach(m=>delete res.m[m]);delete res.beh[k]}});
  res.part=Object.keys(res.m).filter(m=>MET[m].src.some(t=>res.tasks.includes(t)&&V[t]&&V[t].st==='part'));
  onStep(4);await wait();
  scoreRes(res);onStep(5);await wait();return res}

/* ---- norms → z → domains → index, confidence, recommendations ---- */
function zOf(k,v,age){const [m,s]=NORM[k](age);return (v-m)/s}
function zo(k,z){const o=MET[k].o;return o===0?0.674-Math.abs(z):o*z}
function tagOf(k,z){if(MET[k].o===0){const q=Math.abs(z);return q<1?'n':q<2?'w':'b'}const q=MET[k].o*z;return q>-1?'n':q>-2?'w':'b'}
function taskQ(k,q){if(!q)return 0;const kind=TASKS[k].kind;
  if(kind==='rest')return 100*(0.5*q.clean+0.5*clamp((q.r-0.5)/0.45,0,1));
  if(kind==='erp')return 100*(0.3*q.clean+0.35*clamp((q.r-0.3)/0.55,0,1)+0.2*clamp((q.snr||0)/5,0,1)+0.15*clamp(q.n/30,0,1));
  return 100*q.clean}

function gradeOf(v){return v>=75?'hi':v>=55?'md':'lo'}
function scoreRes(res){const a=res.age,mz={};
  Object.keys(res.m).forEach(k=>{const v=res.m[k],z=zOf(k,v,a),[,s]=NORM[k](a),ci=res.ci[k];const se=ci?Math.abs(ci[1]-ci[0])/(2*1.96)/s:Math.sqrt(1-MET[k].rr);mz[k]={z,zo:zo(k,z),se,tag:tagOf(k,z)}});
  res.z=mz;
  const tq={};res.tasks.forEach(k=>tq[k]=taskQ(k,res.q[k]));const imp=res.imp?Math.max(...Object.values(res.imp)):6,impPen=Math.max(0,(imp-10)*2);
  res.tq=tq;res.qual=Math.round(clamp(mean(Object.values(tq))-impPen,0,100));res.conf=gradeOf(res.qual);
  res.dom=DOMS.map(d=>{const ms=d.m.filter(k=>mz[k]);if(!ms.length)return null;const zz=mean(ms.map(k=>mz[k].zo)),se=Math.sqrt(ms.reduce((s,k)=>s+mz[k].se**2,0))/ms.length;
    const srcT=[...new Set(ms.flatMap(k=>MET[k].src.filter(t=>res.tasks.includes(t))))];const q=Math.min(...srcT.map(t=>tq[t]??100))-impPen;
    const pt=ms.some(k=>(res.part||[]).includes(k));return {k:d.k,sc:Math.round(Phi(zz)*100),lo:Math.round(Phi(zz-1.96*se)*100),hi:Math.round(Phi(zz+1.96*se)*100),m:ms,conf:gradeOf(pt?Math.min(q,54):q),part:pt}}).filter(Boolean);
  res.failed=(res.plan||res.tasks).filter(t=>res.v&&res.v[t]&&res.v[t].st==='fail');
  if((res.failed.length||(res.part||[]).length)&&res.conf==='hi')res.conf='md';
  if(res.dom.length&&!res.failed.length){res.idx=Math.round(mean(res.dom.map(d=>d.sc)));res.idxLo=Math.round(mean(res.dom.map(d=>d.lo)));res.idxHi=Math.round(mean(res.dom.map(d=>d.hi)))}
  res.recs=recsOf(res)}
const REC={
  att:[{p:'T',t:'NFB · Theta/Beta Ratio',s:'ลดคลื่นช้า เพิ่มความตั้งใจ',g:'mod:nf#proto=tbr'},{p:'T',t:'P300 · Go/No-Go',s:'ฝึกตอบสนองต่อเป้าหมาย',g:'train'}],
  spd:[{p:'T',t:'P300 · Rhythm',s:'ฝึกความเร็วและจังหวะการตอบสนอง',g:'train'}],
  con:[{p:'T',t:'P300 · Go/No-Go',s:'ลดการกดผิดและความไม่สม่ำเสมอ',g:'train'}],
  calm:[{p:'S',t:'PBM · Deep Calm',s:'Alpha · ตามความถี่ IAPF ของคุณ',g:'mod:pbm'},{p:'T',t:'NFB · Parietal Alpha',s:'เพิ่มอัลฟาที่ Pz · ผ่อนคลาย',g:'mod:nf#proto=pa'},{p:'T',t:'NFB · SMR Center',s:'ฝึกความนิ่งและผ่อนคลาย',g:'mod:nf#proto=smr'}],
  bal:[{p:'T',t:'NFB · Frontal Alpha Asymmetry',s:'ปรับสมดุลซีกซ้าย–ขวา',g:'mod:nf#proto=faa'}],
  eff:[{p:'T',t:'NFB · Frontal Activation',s:'เพิ่มความตื่นตัวขณะคิด',g:'mod:nf#proto=fa'},{p:'S',t:'PBM · Gamma Focus',s:'40 Hz',g:'mod:pbm'}],
  rhy:[{p:'T',t:'NFB · Upper Alpha',s:'เพิ่มอัลฟาช่วงบนที่ Pz · ความจำ',g:'mod:nf#proto=upa'},{p:'S',t:'PBM · Relax & Recover',s:'ย่าน alpha ปรับตาม IAPF ของคุณ',g:'mod:pbm'}]};
function recsOf(res){const ds=[...res.dom].sort((a,b)=>a.sc-b.sc),out=[],seen=new Set();if(res.failed&&res.failed.length)out.push({p:'E',t:'วัดซ้ำเฉพาะงานที่ทำไม่ได้',s:res.failed.map(k=>TASKS[k].n).join(' · ')+' · ใช้เวลาไม่กี่นาที',g:'eval',why:'redo'});
  ds.filter(d=>d.sc<40).concat(ds.slice(0,2)).forEach(d=>(REC[d.k]||[]).forEach(r=>{if(!seen.has(r.t)&&out.length<(res.failed&&res.failed.length?4:3)){seen.add(r.t);out.push({...r,why:d.k})}}));
  out.push({p:'E',t:'Re-assessment',s:'วัดซ้ำใน 4 สัปดาห์ · ใช้ชุดทดสอบเดิม',g:'eval',why:'re'});return out}
/* reliable change index vs previous assessment */
function rciOf(k,v1,v2,age){const [,s]=NORM[k](age),r=MET[k].rr,sdiff=s*Math.sqrt(2*(1-r));return (v2-v1)/sdiff}

/* ---------- re-measure selected tasks and merge into an existing assessment ---------- */
function mergeRedo(o,s,ks){const has=m=>MET[m]&&MET[m].src.some(t=>ks.includes(t)),r=JSON.parse(JSON.stringify(o));r.m=r.m||{};r.ci=r.ci||{};r.q=r.q||{};r.beh=r.beh||{};r.v=r.v||{};
  Object.keys(r.m).forEach(m=>{if(has(m)){delete r.m[m];delete r.ci[m]}});Object.keys(s.m).forEach(m=>{if(has(m)){r.m[m]=s.m[m];if(s.ci[m])r.ci[m]=s.ci[m]}});
  ks.forEach(k=>{if(s.q[k])r.q[k]=s.q[k];else delete r.q[k];if(s.beh[k])r.beh[k]=s.beh[k];else delete r.beh[k];r.v[k]=s.v[k]||{st:'ok',why:[]};if(r.v[k])r.v[k].redo=s.date});
  const C=r.curves=r.curves||{},SC=s.curves||{};
  ['psd','rel','erp'].forEach(g=>{C[g]=C[g]||{};ks.forEach(k=>{const kk=g==='rel'&&k==='ms'?'ma':k;if(SC[g]&&SC[g][kk]!=null)C[g][kk]=SC[g][kk];else delete C[g][kk]})});
  if(ks.some(k=>k==='eo'||k==='ec')){C.topo=SC.topo;C.topoT=SC.topoT}
  if(ks.includes('ma')){C.ma=SC.ma;C.eoFz=SC.eoFz}
  const aud=Object.keys(C.erp).filter(k=>k!=='p3v');if(aud.some(k=>ks.includes(k))){r.m.amp=mean(aud.map(k=>C.erp[k].amp));r.m.lat=mean(aud.map(k=>C.erp[k].lat))}
  r.psd={...(o.psd||{}),...(s.psd||{})};
  r.tasks=TORDER.filter(k=>(o.tasks.includes(k)&&!ks.includes(k))||s.tasks.includes(k));r.plan=TORDER.filter(k=>(o.plan||o.tasks).includes(k)||ks.includes(k));
  r.redo=(o.redo||[]).concat([{ks,date:s.date}]);
  Object.keys(r.m).forEach(k=>{if(!Number.isFinite(r.m[k]))delete r.m[k]});
  r.part=Object.keys(r.m).filter(m=>MET[m].src.some(t=>r.tasks.includes(t)&&r.v[t]&&r.v[t].st==='part'));
  scoreRes(r);return r}

/* ===== Evaluate: task data generation (live run uses the same generator; responses come from the user) ===== */
const EOPT_DEF={rest:120,trials:150,math:120,tone:'std',fast:false};
function mathSpec(u){return u.age<7?{start:30,step:1}:u.age<10?{start:100,step:3}:u.type==='care'||u.age>=65?{start:100,step:4}:{start:300,step:7}}
const MT={n:32,fix:1.0,show:3.0,iti:0.5,lead:2};
function taskLen(k,o){const t=TASKS[k].kind;return t==='rest'?o.rest:t==='math'?o.math:t==='mtr'?MT.lead+MT.n*(MT.fix+MT.show+MT.iti)+1:o.trials*1.2+3.2}
/* verification arithmetic: problem with a proposed answer, press only when it is correct; first half easy, second half hard */
function mathTrials(u,r){const kid=u.age<10,old=u.type==='care'||u.age>=65,out=[];
  for(let i=0;i<MT.n;i++){const hard=i>=MT.n/2;let a,b;
    if(!hard){a=1+Math.floor(r()*(kid?5:8));b=1+Math.floor(r()*(kid?4:8))}
    else if(kid){a=5+Math.floor(r()*5);b=5+Math.floor(r()*5)}else if(old){a=12+Math.floor(r()*30);b=3+Math.floor(r()*7)}else{a=13+Math.floor(r()*60);b=12+Math.floor(r()*30)}
    const s=a+b,ok=r()<0.5,offs=hard&&!kid?[1,-1,2,-2,10,-10]:[1,-1,2,-2],shown=ok?s:Math.max(0,s+offs[Math.floor(r()*offs.length)]);out.push({a,b,shown,ok:shown===s,hard})}return out}
function genTask(B,u,k,o,seed){const kind=TASKS[k].kind,r=rng(seed);if(o.simFail&&k==='ec')B={...B,react:1.03,ecOpen:1};
  if(kind==='erp'){const seq=makeSeq(o.trials,0.2,r);const S=synth(B,'erp',seq.dur,seed+7,{stim:seq.stim,resp:TASKS[k].resp,mod:TASKS[k].mod});S.seq=seq;S.sec=seq.dur;return S}
  if(kind==='mtr'){const trials=mathTrials(u,r),per=MT.fix+MT.show+MT.iti,half=MT.lead+MT.n/2*per,sec=taskLen(k,o);
    const A=synth({...B,mth:1+(B.mth-1)*0.45},'ma',half,seed+7),Bh=synth(B,'ma',sec-half,seed+8);
    const x=CH.map((_,c)=>{const y=new Float32Array(A.N+Bh.N);y.set(A.x[c]);y.set(Bh.x[c],A.N);return y});
    const stim=trials.map((q,i)=>({t:MT.lead+i*per+MT.fix,tg:q.ok,q}));return {x,N:A.N+Bh.N,art:A.art.concat(Bh.art.map(([a,b])=>[a+half,b+half])),seq:{stim,dur:sec},trials,win:MT.show,half,sec}}
  const sec=kind==='math'?o.math:o.rest,S=synth(B,kind==='math'?'ma':k,sec,seed+7);S.sec=sec;if(kind==='math')S.spec=mathSpec(u);return S}
/* simulated responses for demo / example runs */
function autoResp(B,k,T,seed){const r=rng(seed+99);

  if(k==='p3s'){const tr=T.seq.stim.filter(s=>s.tg).length;T.count=tr+Math.round(gauss(r)*(B.kid?1.6:0.8))}
  if(k==='ma'){const kid=B.kid,pr=[];T.seq.stim.forEach(s=>{const hard=s.q.hard;if(s.tg){if(r()<(kid?(hard?.72:.9):(hard?.86:.97)))pr.push(s.t+Math.min(2.9,Math.max(.45,(kid?1.5:B.old?1.3:1.05)*(hard?1.4:1)*Math.exp(gauss(r)*.25))))}else if(r()<(kid?.12:.05))pr.push(s.t+0.8+r()*1.5)});T.presses=pr.sort((a,b)=>a-b)}
  if(k==='ms'){const n=Math.max(1,Math.round(B.steps*T.sec/60*(0.85+r()*0.3)));const err=r()<(B.kid?0.25:0.1);T.math={...T.spec,ans:T.spec.start-T.spec.step*n+(err?1:0),sec:T.sec}}}
function mathEval(m){if(!m||m.ans==null)return null;const d=m.start-m.ans,k=d/m.step;return {steps:Math.max(0,Math.round(k)),ok:Number.isInteger(k)&&k>=0,rate:Math.max(0,k)/(m.sec/60)}}

    let mn=1e9,mx=-1e9;for(let n=n0;n<n1;n++){const v=T.x[c][n];if(n>n1-250){mn=Math.min(mn,v);mx=Math.max(mx,v)}const x=L+(n-(n1-1000))/1000*(W-L-4),y=y0-v*0.32*(rowH/40);n===n0?g.moveTo(x,y):g.lineTo(x,y)}g.stroke();g.globalAlpha=1;q.push(mx-mn)});

const SKIPW=['ลืมตา','ขยับตัวมาก','ร้องไห้ / งอแง','ไม่เข้าใจคำสั่ง','ง่วง / หลับ','อุปกรณ์มีปัญหา'];
function blinkRate(T){const y=bpERP(T.x[2]);let n=0,last=-1e9;for(let i=1;i<y.length-1;i++){if(y[i]>60&&y[i]>=y[i-1]&&y[i]>=y[i+1]&&i-last>0.3*FS){n++;last=i}}return n/(y.length/FS/60)}
function quickCheck(k,T){const kind=TASKS[k].kind,why=[],rk={ok:0,part:1,fail:2};let st='ok',beh=null;const bad=(s,w)=>{why.push(w);if(rk[s]>rk[st])st=s};
  if(kind==='rest'||kind==='math'||kind==='mtr'){const ws=winPSD(T.x),ok=ws.filter(w=>!w.bad).length,cl=ok/Math.max(1,ws.length),fl=Math.min(30,ws.length*.3),pl=Math.min(60,ws.length*.5);
    if(ok<fl||cl<.35)bad('fail',`ข้อมูลสะอาดเหลือ ${ok} วินาที (${Math.round(cl*100)}%) · ขยับ/เกร็งมาก`);else if(ok<pl||cl<.5)bad('part',`ข้อมูลสะอาดเหลือ ${ok} วินาที (${Math.round(cl*100)}%)`);
    if(k==='ec'){const br=blinkRate(T);if(br>=10)bad('fail',`ยังกะพริบตา ${Math.round(br)} ครั้ง/นาที · ลืมตาระหว่างวัด`);else if(br>=3)bad('part',`กะพริบตา ${Math.round(br)} ครั้ง/นาที · อาจลืมตาบางช่วง`);
      const Eo=R&&R.data.eo;if(Eo){const a=x=>{const Pm=meanPSD(winPSD(x));return bandP(Pm[PS(Pm)],BANDS.alpha)},rr=a(T.x)/a(Eo.x);if(rr<1.15)bad(br>=3?'fail':'part',`อัลฟาไม่เพิ่มตอนหลับตา (${rr.toFixed(2)}×)`)}}}
  if(kind==='erp'){const pz=bpERP(T.x[PS(T.x)]),fz=bpERP(T.x[2]);let n=0,N=0;
    T.seq.stim.forEach(s=>{if(!s.tg)return;const n0=Math.round(s.t*FS);if(n0-50<0||n0+200>pz.length)return;N++;let a=1e9,b=-1e9,c=1e9,d=-1e9;for(let i=n0-50;i<n0+200;i++){a=Math.min(a,pz[i]);b=Math.max(b,pz[i]);c=Math.min(c,fz[i]);d=Math.max(d,fz[i])}if(b-a<=100&&d-c<=160)n++});
    if(n<12)bad('fail',`รอบเป้าหมายที่สะอาด ${n}/${N} · ต้องอย่างน้อย 20`);else if(n<20)bad('part',`รอบเป้าหมายที่สะอาด ${n}/${N} (ควร ≥ 20)`);
    if(TASKS[k].resp==='press'){const b=behavOf(T),hr=b.hits/Math.max(1,b.nT);if(hr<.2){beh='fail';bad('part',`กดตอบถูก ${Math.round(hr*100)}% · ไม่ได้ทำงาน (ตัดค่าการกดออก ใช้เฉพาะคลื่นสมอง)`)}else if(hr<.5)bad('part',`กดตอบถูก ${Math.round(hr*100)}% · อาจไม่เข้าใจงาน`);if(b.com>.15)bad('part',`กดผิด ${Math.round(b.com*100)}% ของสิ่งเร้าปกติ`)}
    if(k==='p3s'&&T.count!=null){const tr=T.seq.stim.filter(s=>s.tg).length;if(1-Math.abs(T.count-tr)/tr<.5)bad('part',`นับได้ ${T.count} จาก ${tr} · อาจไม่ได้ตั้งใจนับ`)}}
  if(k==='ma'){const b=behavOf(T),acc=(b.hits+(b.nS-b.fa))/Math.max(1,b.nT+b.nS);if(acc<.6){beh='fail';bad('part',`ตอบโจทย์ถูก ${Math.round(acc*100)}% · ใกล้ระดับเดา (ตัดค่าการตอบออก)`)}}
  if(k==='ms'){const e=T.math&&mathEval(T.math);if(!e||!e.ok)bad('part','คำตอบลบเลขไม่ตรงลำดับ · อาจไม่ได้ทำโจทย์')}
  return {st,why,beh}}

function bandStory(R,CK){const k0=CK[0][0],P=R[k0],th=P.map(x=>x[0]),hb=P.map(x=>x[3]),it=th.indexOf(Math.max(...th)),hi=Math.max(...hb);

function repCmp(r,prev){const hist=H.eval();let h='';

    h+=`<div class="chart"><div class="ch"><b>Brain Index</b><span class="lbl mono">${hist.length} assessments</span></div><svg viewBox="0 0 ${W} ${Hh}"><line x1="16" x2="${W-16}" y1="${Y(50)}" y2="${Y(50)}" stroke="var(--line)" stroke-dasharray="3 3"/><polyline points="${pts.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="var(--E)" stroke-width="2"/>${pts.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${hist[i].id===r.id?6:4}" fill="${hist[i].id===r.id?'var(--E)':'var(--surface)'}" stroke="var(--E)" stroke-width="2" data-rid="${hist[i].id}" style="cursor:pointer"/><text class="ax" x="${X(i)}" y="${Y(v)-8}" text-anchor="middle">${v}</text>`).join('')}</svg></div>`}
  if(!prev)return h+`<div class="tl"><div class="empty">${icon('clock',22)}<br>วัดครั้งถัดไปเพื่อเปรียบเทียบ · Reliable Change Index</div></div>`;
  const ks=Object.keys(r.m).filter(k=>prev.m&&prev.m[k]!=null&&!(r.part||[]).includes(k)&&!(prev.part||[]).includes(k));
  h+=`<div class="sech"><h2>vs ${fmtD(prev.date)}</h2><span class="lbl">RCI ±1.96</span></div><div class="qt">${ks.map(k=>{const rc=rciOf(k,prev.m[k],r.m[k],r.age),o=MET[k].o,sig=Math.abs(rc)>=1.96;
    let cl='eq',t='≈ Stable';if(sig){const good=o===0?Math.abs(zOf(k,r.m[k],r.age))<Math.abs(zOf(k,prev.m[k],r.age)):o*rc>0;cl=good?'up':'dn';t=good?'↑ Improved':'↓ Declined'}
    return `<div class="cmp"><span>${MET[k].n}</span><b>${fmtM(k,prev.m[k])}</b><b>${fmtM(k,r.m[k])}</b><span class="rci ${cl}">${t}</span></div>`}).join('')}</div><p class="fine">RCI = Δ / (SD·√(2(1−r))) · r = test–retest reliability</p>`;
  return h}

function scaleMk(k,v,ci,age){const [m,s]=NORM[k](age),P=MET[k].pct?100:1,lo=m-3*s,hi=m+3*s,W=300,X=x=>12+clamp((x-lo)/(hi-lo),0,1)*(W-24),tag=tagOf(k,zOf(k,v,age)),col={n:'var(--ok)',w:'var(--warn)',b:'var(--danger)'}[tag];

 listen:{lv:'งานวิจัยนำร่อง',why:'ฝึกแยกเสียงเป้าหมายที่นาน ๆ จะมาครั้งออกจากเสียงอื่น (auditory oddball) เป็นงานเดียวกับที่ใช้วัดคลื่น P300 ซึ่งสะท้อนการจัดสรรความใส่ใจ',f:[['P300 เป็นตัวชี้วัดความใส่ใจที่ใช้กันแพร่หลาย ยิ่งตั้งใจ คลื่นยิ่งใหญ่และเร็ว','Polich 2007 · ทบทวนงานวิจัย'],['ฝึกเกมความใส่ใจ 5 วัน เด็ก 4–6 ปีมีคลื่นสมองด้านควบคุมความใส่ใจใกล้เคียงผู้ใหญ่มากขึ้น','Rueda 2005 · PNAS']],r:['polich07','rueda05','vandint14','cortese15']},

  const ok=E.n>=10&&E.clean>=.6&&E.ci[0]>0,xs=Array.from({length:125},(_,i)=>-200+i*8),all=[...E.t,...E.s],mx=Math.max(...all)+3,mn=Math.min(...all)-2,lab=g==='gonogo'?['No-Go','Go']:['เป้าหมาย','อื่น ๆ'];

  return `<div class="geeg"><div class="geh">${icon('head',16)}<b>Brain response · P300</b><span class="gq ${ok?'hi':'lo'}">${ok?'เชื่อถือได้':'ข้อมูลน้อย'} · n=${E.n}</span></div>
   ${lineSVG({xs,series:[{y:E.s,c:'var(--muted)',w:1.2},{y:E.t,c:'var(--T)',w:2.2,band:E.se}],xmin:-200,xmax:800,ymin:Math.floor(mn),ymax:Math.ceil(mx),xt:[0,200,400,600,800],yt:[0,5,10,15].filter(v=>v<mx&&v>mn),shade:[[250,600,'var(--T)','P300']],marks:[{top:1,x:E.lat,y:E.amp,c:'var(--T)',l:''}]})}

function hsCheck(o){const u=curUser().id,key='nl_chk_'+u+'_'+dayKey(Date.now()),prev=ls.get(key,null),act=o.act,els=[...act,'Ref','GND'],fresh=!!prev&&o.auto!==false;
  const C={z:{},tg:{},t:0,ok:0,raf:0};els.forEach(n=>{C.z[n]=fresh?6+Math.random()*6:20+Math.random()*25;C.tg[n]=3.5+Math.random()*5});if(!fresh&&Math.random()<.35)C.tg[els[Math.floor(Math.random()*els.length)]]=24;
  let hum=fresh?1:3.2,humT=Math.random()<.12?2.2:.8;
  $('v-game').innerHTML=`<div class="gtop"><span class="lbl">${o.lbl}</span><span style="flex:1"></span><button class="iconbtn" id="gc-x" aria-label="ปิด">✕</button></div><div class="rstage gstage gck"><div id="gc-hs" style="width:100%"></div><button class="btn pri tpri" id="gc-go" disabled>กำลังเช็ค…</button>${o.skip?`<button class="btn link" id="gc-skip">${o.skip}</button>`:''}</div>`;
  const stop=()=>cancelAnimationFrame(C.raf);
  $('gc-x').onclick=()=>{stop();o.onX()};
  if(o.skip)$('gc-skip').onclick=()=>{stop();o.onSkip()};
  $('gc-go').onclick=()=>{stop();const z={};els.forEach(n=>z[n]=+C.z[n].toFixed(1));ls.set(key,{...(prev||{}),...z,date:new Date().toISOString()});o.onGo(z)};
  let last=performance.now(),rt=0;
  const loop=now=>{if(!document.getElementById('gc-hs'))return;const dt=Math.min(.1,(now-last)/1000);last=now;C.t+=dt;rt+=dt;
    els.forEach(n=>{C.z[n]+=(C.tg[n]-C.z[n])*Math.min(1,dt*(fresh?3:1.4))});hum+=(humT-hum)*Math.min(1,dt*1.5);
    if(rt>.15){rt=0;const red=els.find(n=>C.z[n]>=20),amb=els.find(n=>C.z[n]>=10),mok=hum<1.5,ok=!amb&&mok;
      const fix=red&&C.t>1.5?hsFix(red,C.z[red]):!mok&&C.t>1.5?hsFix(null,0,false):!ok?{msg:'กำลังวัดค่าความต้านทาน รอให้ต่ำกว่า 10 kΩ'}:null;
      $('gc-hs').innerHTML=hsHTML({act,z:C.z,sub:o.sub+(fresh?' · เช็คแล้ววันนี้':''),mains:{pct:hum/4,txt:hum.toFixed(1)+' µV',ok:mok},fix});
      $('gc-hs').querySelectorAll('.hs-fx').forEach(b=>b.onclick=()=>{const n=b.dataset.n;if(n==='hum')humT=.8;else C.tg[n]=3.5+Math.random()*4});
      if($('hw-head'))$('hw-head').innerHTML=hwHead(Object.fromEntries(act.map(n=>[n,C.z[n]])));
      const bt=$('gc-go');bt.disabled=!ok;bt.textContent=ok?o.okTxt:'กำลังเช็ค…';
      if(ok){C.ok+=.15;if(fresh&&C.ok>=.9){$('gc-go').click();return}}else C.ok=0}
    C.raf=requestAnimationFrame(loop)};
  C.raf=requestAnimationFrame(loop)}

/* pillar motifs (inline SVG, themable): S = warm light rings around a head profile, T = brain waves that calm as the goal fills */
function motifS(p){/* calm: 3 thin light rings radiating from behind the play button */
  return `<svg class="tc-m" viewBox="0 0 160 100" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">${[0,1,2].map(k=>`<circle cx="136" cy="50" r="${30+k*16}" fill="none" stroke="var(--S)" stroke-width="1" opacity="${(.5-k*.14)*(.5+p*.5)}"/>`).join('')}</svg>`}
function motifT(p,col='var(--T)',cls='tc-m'){/* calm: two soft waves that flatten as the goal fills */
  const w=[0,1].map(k=>{const y=40+k*20,amp=(1-p*.7)*(5-k*1.5);let d=`M60 ${y}`;for(let x=60;x<=160;x+=3)d+=` L${x} ${(y+Math.sin((x+k*17)/9)*amp).toFixed(1)}`;return `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.1" opacity="${.5-k*.15}" stroke-linecap="round"/>`}).join('');
  return `<svg class="${cls}" viewBox="0 0 160 100" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">${w}</svg>`}

/* ===== Map: one timeline across S / T / E ===== */
function spark(vals,col,lowerBetter){if(vals.length<2)return `<svg viewBox="0 0 100 38"><line x1="0" x2="100" y1="19" y2="19" stroke="var(--line)" stroke-dasharray="3 3"/></svg>`;
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1,X=i=>4+i/(vals.length-1)*92,Y=v=>32-(v-mn)/rg*26;
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  return `<svg viewBox="0 0 100 38" preserveAspectRatio="none"><polygon points="4,36 ${pts.join(' ')} 96,36" fill="${col}" opacity=".12"/><polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${X(vals.length-1)}" cy="${Y(vals[vals.length-1])}" r="2.6" fill="${col}"/></svg>`}
function trendCard(n,vals,unit,col,d=0,lowerBetter){const last=vals[vals.length-1],first=vals[0],dl=vals.length>1?last-first:null;
  const good=dl==null?null:lowerBetter?dl<0:dl>0;
  return `<div class="trd"><div class="h"><span>${n}</span>${dl!=null&&Math.abs(dl)>1e-9?`<span style="color:${good?'var(--ok)':'var(--warn)'}">${dl>0?'▲':'▼'} ${Math.abs(dl).toFixed(d)}</span>`:''}</div><b>${last!=null?(+last).toFixed(d):'—'}<span class="lbl"> ${unit}</span></b>${spark(vals,col,lowerBetter)}</div>`}
function renderMon(){const u=curUser(),ev=events(),el=$('v-mon'),E=H.eval(),now=Date.now(),D=864e5;

  const dl=`<span></span>`+days.map((d,i)=>`<span>${i%2?'':d.getDate()}</span>`).join('');
  const in30=e=>now-new Date(e.d)<30*D,activeDays=new Set(ev.filter(e=>now-new Date(e.d)<14*D).map(e=>dayKey(e.d))).size;
  const sMin=Math.round(ev.filter(e=>e.p==='S'&&in30(e)).reduce((s,e)=>s+(e.min||0),0)),tN=ev.filter(e=>e.p==='T'&&in30(e)).length,eN=ev.filter(e=>e.p==='E'&&in30(e)).length;

/* ===== clinic link + automatic upload (T-11) =====
   A signed-in profile can be shared with a clinic: the parent types the clinic's 6-character code (shown in Monitor) and ticks consent.
   Then every ~30 s (and when the phone comes back online) records that changed since the last upload are sent with RPC app_push,
   in the same brainstem.export v1 shape as the file export. Offline = they wait here (the "queue" is: records whose hash differs from what was sent).
   Server side: supabase/migrations/20261021150000_clinic_link.sql. Uses auCall / auS from a_auth.js (loaded after this file; only used at run time). */
const SY_K='bs_sync',SY_L='bs_links',SY_KINDS=['evaluations','pbm','nfb','p300'],SY_BATCH=40;

const syLinks=c=>(ls.get(SY_L,{})[c]||[]);
async function syFetchLinks(){const rows=await auCall('/rest/v1/rpc/my_links',{method:'POST',body:{}}),m={};
  rows.forEach(r=>(m[r.profile_id]=m[r.profile_id]||[]).push({id:r.clinic_id,name:r.name,linked:r.linked_at,sync:r.last_sync}));
  ls.set(SY_L,m);syLinksAt=Date.now();return m}
function syHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
/* what has been sent is remembered per profile AND per set of clinics: a newly linked clinic gets the full history */
function sySent(p){const all=ls.get(SY_K,{}),sig=syLinks(p.cloud).map(c=>c.id).sort().join(','),s=all[p.cloud];return s&&s.sig===sig?s:{sig,h:{},at:s&&s.at}}
function syPending(p){const d=buildExport([p.id],false),sent=sySent(p).h,todo=[];
  SY_KINDS.forEach(k=>(d.records[k]||[]).forEach(r=>{const key=k==='evaluations'?'e:'+r.id:k+':'+r.date,h=syHash(JSON.stringify(r));if(sent[key]!==h)todo.push({k,r,key,h})}));

async function syPush(p){const {d,todo}=syPending(p),s=sySent(p);
  for(let i=0;i<todo.length;i+=SY_BATCH){const part=todo.slice(i,i+SY_BATCH),rec={};SY_KINDS.forEach(k=>rec[k]=[]);part.forEach(x=>rec[x.k].push(x.r));
    await auCall('/rest/v1/rpc/app_push',{method:'POST',body:{p_profile:p.cloud,p_code:p.id,d:{...d,records:rec}}});
    part.forEach(x=>s.h[x.key]=x.h);s.at=new Date().toISOString();const all=ls.get(SY_K,{});all[p.cloud]=s;ls.set(SY_K,all)}

/* one pass: refresh links now and then, push every linked profile. Errors leave the records pending for the next pass. */
async function syRun(force=false){
  if(syBusy||typeof auS==='undefined'||!auS||navigator.onLine===false)return;syBusy=true;
  try{if(force||Date.now()-syLinksAt>120e3)await syFetchLinks();
    for(const p of profiles())if(p.cloud&&syLinks(p.cloud).length)await syPush(p);
    if(force||Date.now()-pgAt>110e3)await pgFetch();   /* clinic program + appointments (a_prog.js) */
    ls.set('bs_sync_err',null)}
  catch(e){ls.set('bs_sync_err',e.message)}
  finally{syBusy=false}}
setInterval(syRun,30e3);addEventListener('online',()=>syRun());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syRun()});setTimeout(syRun,4e3);

/* ===== clinic program: what the clinic set in Monitor (Remote tab, Calendar, Care Plan) =====
   For a profile linked to a clinic, RPC app_program returns the remote program (modules / protocols shown, PBM time limit, self-made programs),
   the clinic's own PBM programs and the appointments from yesterday to 14 days ahead. Kept per local profile id in localStorage bs_prog,
   read by the home "Today" card, the Schedule page, the Train page and the PBM / NF modules. No link = everything as before.
   Server side: supabase/migrations/20261021170000_remote_care.sql. Fetched by syRun (a_sync.js) about every 2 minutes. */
/* var / function declarations: renderHome (s_set.js) can run before this file's lines have executed */
var PG_K='bs_prog',PG_KIND={pbm:'S',nfb:'T',p300:'T',assessment:'E',telehealth:'C',phone:'C',chat:'C',visit:'C'};
var pgAt=0;
function pgSod(t){const x=new Date(t);x.setHours(0,0,0,0);return x.getTime()}
async function pgFetch(){const m={};
  for(const p of profiles()){if(!p.cloud||!syLinks(p.cloud).length)continue;
    const rows=await auCall('/rest/v1/rpc/app_program',{method:'POST',body:{p_profile:p.cloud}})||[];
    if(rows.length)m[p.id]={...rows[0],events:rows.flatMap(r=>r.events||[]).sort((a,b)=>a.at<b.at?-1:1),at:new Date().toISOString()}}
  const before=JSON.stringify(ls.get(PG_K,{}));ls.set(PG_K,m);pgAt=Date.now();
  if(JSON.stringify(m)!==before&&typeof NAV!=='undefined'&&['home','plan','train'].includes(NAV.view))go(NAV.view,false)}
function pg(){return ls.get(PG_K,{})[curUser().id]||null}
function pgOff(k){const g=pg();return !!(g&&g.program&&(g.program.off||[]).includes(k))}

function pgOk(kind,id){const g=pg(),a=g&&g.program&&g.program.allow&&g.program.allow[kind];if(pgOff(kind))return false;if(!a)return true;

function pgLate(t=new Date()){const u=pgUntil();return u!=null&&t.getHours()+t.getMinutes()/60>=u}
function pgProto(id){const g=pg();return (g&&(g.protocols||[]).find(p=>p.id===id))||null}

/* appointments with a state: server status wins; otherwise a record made on this phone that day completes it (one record per appointment),
   a past day without one is missed — the same rule Monitor uses */
function pgEvents(){const g=pg();if(!g)return [];const used={};
  const recs={pbm:H.pbm(),nfb:H.nf(),p300:H.tr(),assessment:H.eval().filter(e=>!e.example)};
  return (g.events||[]).map(e=>{let st=e.status||'scheduled';const d=dayKey(e.at),R=recs[e.kind];
    if(R&&(st==='scheduled'||st==='completed')){const k=e.kind+d,n=R.filter(r=>dayKey(r.date)===d).length,u=used[k]||0;
      if(u<n){used[k]=u+1;st='completed'}else if(st==='scheduled'&&pgSod(e.at)<pgSod(Date.now()))st='missed'}

/* course credits (patient_accounts.sql): at 0 the clinic turned PBM / NFB / P300 off until a new course is added */

const auUid=()=>auS&&auS.user&&auS.user.id;

function ageOf(b,now=new Date()){if(!b)return null;const d=new Date(b+'T00:00:00');let y=now.getFullYear()-d.getFullYear(),m=now.getMonth()-d.getMonth();if(now.getDate()<d.getDate())m--;if(m<0){y--;m+=12}return {y,m}}

  const a=ageOf(r.birth_date),ex=ps.find(p=>p.cloud===r.id);
  return Object.assign(ex||{},{cloud:r.id,name:r.nickname||r.real_name,real:r.real_name,sex:r.sex,birth:r.birth_date,age:a?clamp(a.y,1,120):(ex&&ex.age)||9,type:r.type,
    hand:r.handedness,guardian:{name:r.guardian_name||'',rel:r.guardian_relation||'',phone:r.guardian_phone||''},photoPath:r.photo_path})}
const auRow=p=>({real_name:p.real,nickname:p.name||null,sex:p.sex||null,birth_date:p.birth||null,type:p.type,handedness:p.hand||null,local_code:p.id,
  guardian_name:p.guardian&&p.guardian.name||null,guardian_relation:p.guardian&&p.guardian.rel||null,guardian_phone:p.guardian&&p.guardian.phone||null});

async function auPushPhoto(p){/* photo is optional: a failure here must not lose the profile */
  const path=auUid()+'/'+p.cloud+'.jpg';
  if(p.photo){await auCall('/storage/v1/object/'+AU_SB.bucket+'/'+path,{method:'POST',raw:await auBlob(p.photo),headers:{'Content-Type':'image/jpeg','x-upsert':'true'}});return path}
  if(p.photoPath){try{await auCall('/storage/v1/object/'+AU_SB.bucket+'/'+p.photoPath,{method:'DELETE'})}catch(e){}}
  return null}
async function auSave(p){/* insert or update one profile; returns the local profile with .cloud set */
  if(p.cloud)await auCall('/rest/v1/app_profile?id=eq.'+p.cloud,{method:'PATCH',body:auRow(p)});
  else{const r=await auCall('/rest/v1/app_profile',{method:'POST',body:{...auRow(p),consent_at:new Date().toISOString()},headers:{Prefer:'return=representation'}});p.cloud=r[0].id}

  if(path!==(p.photoPath||null)){await auCall('/rest/v1/app_profile?id=eq.'+p.cloud,{method:'PATCH',body:{photo_path:path}});p.photoPath=path}

async function auPull(){/* cloud -> device; keeps local-only profiles */
  const rows=await auRows();let ps=profiles();if(rows.length)ps=auSeedFree(ps);
  for(const r of rows){const p=auLocal(r,ps);if(!ps.includes(p)){p.id=auNewId(ps);ps.push(p)}

      <label class="btn sm">${icon('cam',15)} ถ่ายรูป<input type="file" accept="image/*" capture="user" id="au-cam" hidden></label>
      <label class="btn sm">เลือกรูป<input type="file" accept="image/*" id="au-pick" hidden></label>
      <button type="button" class="btn link" id="au-rm"${f.photo?'':' hidden'}>ไม่ใช้รูป</button></div></div>
    <label class="au-l"><span class="lbl">ชื่อจริง - นามสกุล *</span><input class="inp" id="au-real" autocomplete="name" maxlength="120" value="${esc(f.real||'')}" required></label>
    <label class="au-l"><span class="lbl">ชื่อเล่น (ชื่อที่แสดงในแอป)</span><input class="inp" id="au-nick" maxlength="60" value="${esc(f.name&&f.name!==f.real?f.name:'')}" placeholder="เช่น น้องต้นกล้า"></label>
    <div class="au-l"><span class="lbl">เพศ</span>${seg('sex',SEXL)}</div>
    <label class="au-l"><span class="lbl">วันเดือนปีเกิด *</span><input class="inp" id="au-bd" type="date" max="${today}" min="1900-01-01" value="${esc(f.birth||'')}" required><span class="au-age" id="au-age">${auAgeTxt(f.birth)}</span></label>
    <div class="au-l"><span class="lbl">กลุ่มผู้ใช้</span>${seg('type',TYPEL)}</div>
    <div class="au-l"><span class="lbl">ถนัดมือ</span>${seg('hand',HANDL)}<span class="fine">ใช้กับเกมกดปุ่ม และการแปลผลสมองซีกซ้าย-ขวา</span></div>
    <fieldset class="au-gd" id="au-gd"><legend class="lbl">ผู้ปกครอง / ผู้ดูแล</legend>
      <input class="inp" id="au-gn" maxlength="120" placeholder="ชื่อผู้ปกครอง" value="${esc(f.guardian.name)}">
      <div class="au-2"><input class="inp" id="au-gr" maxlength="40" list="au-rels" placeholder="เกี่ยวข้องเป็น" value="${esc(f.guardian.rel)}"><input class="inp" id="au-gp" type="tel" inputmode="tel" maxlength="30" autocomplete="tel" placeholder="เบอร์โทร" value="${esc(f.guardian.phone)}"></div>
      <datalist id="au-rels"><option value="แม่"><option value="พ่อ"><option value="ผู้ปกครอง"><option value="ผู้ดูแล"><option value="ลูก"></datalist></fieldset>
    ${signed&&!(old&&old.cloud)?`<label class="au-ck"><input type="checkbox" id="au-ok"><span>ยินยอมให้เก็บข้อมูลนี้ออนไลน์ เพื่อใช้ในโปรแกรมฝึกสมอง · เห็นได้เฉพาะบัญชีนี้ (และคลินิกที่คุณเลือกแชร์ด้านล่าง) · ขอลบได้ทุกเมื่อ</span></label>`:''}
    ${syFormHTML(old)}
    ${signed?'':'<p class="fine">ไม่ได้ล็อกอิน: ข้อมูลเก็บในเครื่องนี้เท่านั้น</p>'}
    <div class="err" id="au-err" role="alert"></div>
    <button class="btn pri" type="submit" id="au-go">${old?'บันทึก':'เริ่มใช้งาน'}</button>
   </form>
   ${first?`<button class="btn link" id="au-out">ออกจากระบบ</button>`:''}`);
  const prev=()=>{$('au-av').innerHTML=avHTML({id:'new',type:f.type,photo:f.photo},'lg');$('au-rm').hidden=!f.photo};
  const gd=()=>{const a=ageOf($('au-bd').value);$('au-gd').hidden=f.type==='adult'&&!(a&&a.y<18)};
  auEl().querySelectorAll('.seg[data-k]').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{f[s.dataset.k]=b.dataset.v;if(s.dataset.k==='type')typeSet=true;
    s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));if(s.dataset.k==='type'){prev();gd()}}));
  const setType=t=>{f.type=t;auEl().querySelectorAll('.seg[data-k=type] button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===t));prev();gd()};
  $('au-bd').oninput=()=>{$('au-age').textContent=auAgeTxt($('au-bd').value);const a=ageOf($('au-bd').value);if(!typeSet&&a&&a.y>=0)setType(auType(a.y));gd()};
  ['au-cam','au-pick'].forEach(k=>$(k).onchange=e=>readPhoto(e.target.files[0],d=>{f.photo=d;prev()}));$('au-rm').onclick=()=>{f.photo=null;prev()};
  if($('au-x'))$('au-x').onclick=()=>{auEl().hidden=true;auEl().innerHTML=''};
  if($('au-out'))$('au-out').onclick=auSignOut;
  gd();syBindForm(old);
  $('au-f').onsubmit=async ev=>{ev.preventDefault();const err=t=>{$('au-err').textContent=t};
    f.real=$('au-real').value.trim();f.name=$('au-nick').value.trim()||f.real.split(/\s+/)[0];f.birth=$('au-bd').value;
    f.guardian={name:$('au-gn').value.trim(),rel:$('au-gr').value.trim(),phone:$('au-gp').value.trim()};
    const a=ageOf(f.birth);
    if(!f.real)return err('กรอกชื่อจริง');if(!f.birth||!a||a.y<0||f.birth>today)return err('เลือกวันเกิด');
    if(f.guardian.phone&&!/^[0-9+\-\s()]{6,30}$/.test(f.guardian.phone))return err('เบอร์โทรไม่ถูกต้อง');
    if($('au-ok')&&!$('au-ok').checked)return err('กรุณาติ๊กยินยอมก่อน');
    const cc=syCode();if(cc===false)return err('ติ๊กยินยอมให้คลินิกเห็นข้อมูลก่อน หรือลบรหัสคลินิกออก');
    f.age=clamp(a.y,1,120);if(!f.photo)delete f.photo;if(f.type==='adult'&&a.y>=18&&!$('au-gn').value.trim())f.guardian={name:'',rel:'',phone:''};
    const b=$('au-go');b.disabled=true;b.textContent='กำลังบันทึก…';
    try{let ps=profiles(),p=old?ps.find(x=>x.id===old.id):null;
      if(!p){p={id:auNewId(ps)};ps.push(p)}
      Object.assign(p,f);if(!f.photo)delete p.photo;
      if(signed){await auSave(p);if(first)ps=auSeedFree(ps)}
      ls.set('nl_profiles',ps);setUser(p.id);
      if(cc){try{const r=await syLink(p,cc);toast('เชื่อมกับ '+r.name+' แล้ว · จะส่งผลให้อัตโนมัติ')}
        catch(x){auProfile(p.id);$('au-err').textContent='บันทึกโปรไฟล์แล้ว แต่เชื่อมคลินิกไม่สำเร็จ: '+x.message;return}}
      else toast(old?'บันทึกแล้ว':'สร้างโปรไฟล์แล้ว');auClose()}
    catch(x){err(x.message);b.disabled=false;b.textContent=old?'บันทึก':'เริ่มใช้งาน'}}}

async function auSignOut(){try{await auCall('/auth/v1/logout',{method:'POST'})}catch(e){}auKeep(null);ls.set('bs_guest',0);closeSheet();auLogin('in')}

/* account row for the profiles sheet */
function auAcctHTML(){const u=auS&&auS.user;return u?`<div class="au-acct"><span>${icon('okc',16)} <span data-raw>${esc(u.email||'บัญชี Google')}</span></span><button class="btn sm" id="au-so">ออกจากระบบ</button></div>`
  :`<div class="au-acct"><span class="note">ยังไม่ได้ล็อกอิน · ข้อมูลอยู่ในเครื่องนี้</span><button class="btn sm" id="au-si">เข้าสู่ระบบ</button></div>`}
function auBindAcct(){if($('au-so'))$('au-so').onclick=auSignOut;if($('au-si'))$('au-si').onclick=()=>{closeSheet();auLogin('in')}}

/* ---------- start: handle a return from Google / email link, else show sign-in unless the user chose local use ---------- */
async function auStart(){
  const h=new URLSearchParams(location.hash.slice(1)),q=new URLSearchParams(location.search);
  const clean=()=>{try{history.replaceState(null,'',auBack())}catch(e){}};
  if(h.get('access_token')){auSet({access_token:h.get('access_token'),refresh_token:h.get('refresh_token'),expires_at:+h.get('expires_at')||0,expires_in:h.get('expires_in')});clean();
    try{auS.user=await auCall('/auth/v1/user');auKeep(auS)}catch(e){auKeep(null);return auLogin('in',e.message)}
    if(h.get('type')==='recovery')return auNewPw();return auAfter()}
  const e=h.get('error_description')||q.get('error_description');if(e){clean();return auLogin('in',auMsg(e.replace(/\+/g,' ')))}
  if(auS){/* signed in earlier: refresh profiles quietly; offline keeps the local copy */
    try{const n=await auPull();if(!n)return auProfile(null,true);renderWho();refresh()}catch(x){if(!auS)auLogin('in',x.message)}return}
  if(!ls.get('bs_guest',0))auLogin('in')}
auStart();

</script>
